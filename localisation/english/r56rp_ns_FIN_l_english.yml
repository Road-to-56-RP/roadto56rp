# R56RP Focuses
#Monarchist
 FIN_r56rp_reach_out_to_the_monarchists: "Reach out to the Monarchists"
 FIN_r56rp_reach_out_to_the_monarchists_desc: "The idea of a Monarchy in Finland may to some seem strange, but for a short period of time we had one. Though we have been a republic for a while now, there are many who long for the sense of stability a Monarch can provide, we should reach out to these individuals"
 FIN_r56rp_compromise_with_the_conservatives: "Compromise with the Conservatives"
 FIN_r56rp_compromise_with_the_conservatives_desc: "The Conservatives were vital in our battle against the Reds after the end of the Great War, now, we need to reach out to them once more, but not to combat Communists, but to help us bring stability to Finland"
 FIN_r56rp_rally_public_support: "Rally Public Support"
 FIN_r56rp_rally_public_support_desc: "The one thing we will have to secure to bring about a Monarchy in Finland, is to gather the hearts and minds of the people. By funding public works and other projects for the Population in the name of a Monarchy, we will help ensure their loyalty to the new crown"
 FIN_r56rp_form_a_monarchist_party: "Form a Monarchist Party"
 FIN_r56rp_form_a_monarchist_party_desc: "With portions of the public backing the idea of a new Monarch and the Conservatives gathered to our cause, we can now form a new political party, one that'll soon be led by our new Monarch"
 FIN_r56rp_a_swedish_candidate: "A Swedish Candidate"
 FIN_r56rp_a_swedish_candidate_desc: "It is no secret that we have a long and storied history with the Swedes to the west and while we were under the Tsar for many decades, a large portion of our population speak Swedish as their second language, making it easier for a Swedish candidate to gain popularity"
 FIN_r56rp_the_german_heir: "The German Heir"
 FIN_r56rp_the_german_heir_desc: "For a brief period of time, we had a German Prince as the King of Finland, then, the Red Revolution came and the idea of a monarchy fell to the way-side. Now, while the elected King may no longer walk this earth, his Son is technically the heir to the Finnish throne, should we re-establish it"
 FIN_r56rp_a_junior_partner: "A Junior Partner"
 FIN_r56rp_a_junior_partner_desc: "Now with a Swedish King on the Throne, we have to take into consideration that quite a few countries may not see him as legitimate. So, by submitting to the Swedes as a Junior Partner, we can gain legitimacy as a Kingdom along side them"
 FIN_r56rp_the_two_brothers: "The Two Brothers"
 FIN_r56rp_the_two_brothers_desc: "With King Bertil the First on the Throne of Finland, we should reach out to his homeland, the Kingdom of Sweden and help foster an alliance between our two nations. The Swedes have already proven to be willing allies in the past and now the time is ripe for an alliance"
 FIN_r56rp_strengthen_crown_ties: "Strengthen Crown Ties"
 FIN_r56rp_strengthen_crown_ties_desc: "With our new Monarch on the throne, we should reach out to their family and help strengthen the ties between our two Crowns."
 FIN_r56rp_generalstab_reform: "Generalstab Reform"
 FIN_r56rp_generalstab_reform_desc: "The German studies on Bewegungskrieg following the Great War would undoubtedly prove to be immensely useful for us to get our hands on. By underlining our new Monarchial ties along with the threat of a common foe, we should ask for their assitance in reforming our armed forces into something similar as to what they are currently experimenting with"
 FIN_r56rp_finno_swedish_war_games: "Finno-Swedish War Games"
 FIN_r56rp_finno_swedish_war_games_desc: "With our two nations now bound into an Alliance, we should seek to conduct some joint exercises to help build up coordination between our armed forces should we have to deploy our troops together"
 FIN_r56rp_industrial_support: "Industrial Support"
 FIN_r56rp_industrial_support_desc: "With the ties between our crowns strengthened, we should ask for assistance in bringing our industry up to speed to the rest of Europe, with their help we should be able to gain the momentum needed to further propel our economy forward"
 FIN_r56rp_military_support: "Military Support"
 FIN_r56rp_military_support_desc: "Thanks to our improved relations between our two crowns, we should reach out to our allies and ask for assistance with constructing some new arms industries so that we can aid our brethren should war come to our borders"
 FIN_r56rp_royal_institute_of_technology: "Royal Institute of Technology"
 FIN_r56rp_royal_institute_of_technology_desc: "With a Monarchy established, our next step is to encourage our people to try and strive to be the best. By establishing a Royal Institute of Technology, we can funnel the best and brightest minds of Finland to help secure our place in the world"
 FIN_r56rp_finnish_auftagstaktik: "Finnish Auftragstaktik"
 FIN_r56rp_finnish_auftagstaktik_desc: "The idea of Auftragstaktik proved to be quite capable during the Great War, it is something that we should ask the Germans to help us implement within our own Army Corps"
 FIN_r56rp_finno_swedish_naval_cooperation: "Finno-Swedish Naval Cooperation"
 FIN_r56rp_finno_swedish_naval_cooperation_desc: "If there's one thing that the Great War proved, it was that access to the Sea is going to be crucial for survival. Luckily for us, the Swedes have made significant leaps in Naval research compared to us and by cooperating with them, we will be able to establish a new and proper Royal Navy, truly fit for a King"
 FIN_r56rp_lockdown_the_baltic: "Lockdown the Baltic"
 FIN_r56rp_lockdown_the_baltic_desc: "There is no secret that a War is looming on the horizon before us, and to ensure that our shores are not swept away by landing craft, like the British did in Anatolia, we have to work with the Swedes to help lockdown the Baltic sea in the event of another war"
 FIN_r56rp_prepare_the_russian_border: "Prepare the Russian Border"
 FIN_r56rp_prepare_the_russian_border_desc: "We are well aware that the Russians to our East long for our lands and it is looking more and more probable that we are going to be drawn into a war with them soon enough. Thus, we must prepare and ensure that the strength of our borders will repell any Russian invasion"
 FIN_r56rp_invite_german_military_staff: "Invite German Military Staff"
 FIN_r56rp_invite_german_military_staff_desc: "With our Army structure already becoming more and more similar to that of the Germans, it only makes sense for us to bring in those who truly understand it. By extending an invitation to the German High Command we should hopefully be able to get some proper support with restructuring our Armed Forces"
 FIN_r56rp_towards_a_greater_finland: "Towards a Greater Finland"
 FIN_r56rp_towards_a_greater_finland_desc: "The idea of a Greater Finland has been circulating among the population for years, especially following the Russian Civil War, now, it is within our grasp. We should prepare for a potential invasion of Russia to unify all Finnish lands"
 FIN_r56rp_the_finnish_bear_trap: "The Finnish Bear Trap"
 FIN_r56rp_the_finnish_bear_trap_desc: "No one knows the Russians better than we do, and no one knows the Finnish lands like we do. Utilising both of these we will be able to set a trap for the Russian bear, one that will cripple the bear for good"
 FIN_r56rp_a_call_to_arms: "A Call to Arms"
 FIN_r56rp_a_call_to_arms_desc: "To strike at the Russians we need every able-boddied man to serve in our armed forces. We shall therefore send out a call to arms to every man who is willing to stand for the idea of a Greater Finland to enlist now and fight for a great cause!"
 FIN_r56rp_strike_the_russian_bear: "Strike the [SOV.GetAdjective] Bear"
 FIN_r56rp_strike_the_russian_bear_desc: "The time is at hand, we shall finally strike at the Russians and we will make them bleed"
 FIN_r56rp_greater_finland_achieved: "Greater Finland Achieved"
 FIN_r56rp_greater_finland_achieved_desc: "Through blood, sweat and tears have we achieved the impossible. The lands of Greater Finland are now under our control and now, we need to secure our new lands"
 FIN_r56rp_an_ally_not_a_subject: "An Ally, Not a Subject"
 FIN_r56rp_an_ally_not_a_subject_desc: "While we have learned much from our Overlord, it is now time to sever the bond, though we do not need to end our alliance. It is time that we stepped out of the shadow and stand tall"
 FIN_r56rp_industrialize_our_new_lands: "Industrialize Our New Lands"
 FIN_r56rp_industrialize_our_new_lands_desc: "The lands of Karelia and Murmansk while bountiful, are severely underdeveloped, we need to invest in these lands so that they are easier for us to defend and also let them know they are a vital part of our Kingdom"
 FIN_r56rp_shorter_border_longer_peace: "Shorter Border, Longer Peace"
 FIN_r56rp_shorter_border_longer_peace_desc: "The idea of a Shorter Border, Longer Peace is one that we need to embody, with our new borders we share a much shorter border with the Russians, this will, hopefully, act as a natural deterrent against any future aggression from them"
 FIN_r56rp_return_of_the_ingrian_finns: "Return of the Ingrian Finns"
 FIN_r56rp_return_of_the_ingrian_finns_desc: "There are a large population of Finns living in Ingria, with our new lands secured, we should call out to them and tell them to come back to Finland proper. Their home is no longer under threat from the Russians and they are welcome here"
 FIN_r56rp_lay_claim_to_ingria: "Lay Claim to Ingria"
 FIN_r56rp_lay_claim_to_ingria_desc: "The large Finnish Population in Ingria is the last piece that we need to truly call ourselves Greater Finland, and the Russians know we will be coming for them"
 FIN_r56rp_develop_murmansk_ship_building: "Develop [213.GetName] Ship Building"
 FIN_r56rp_develop_murmansk_ship_building_desc: "By further developping [213.GetName] we will be able to establish a new Ship Building site that is not so easily blocked through the Danish straits, though we will not be able to sail large ships through there during the Winter, convoys and Submarines will have greater access to the Atlantic"
 FIN_r56rp_railway_expansion_project: "Railway Expansion Project"
 FIN_r56rp_railway_expansion_project_desc: "With our new lands secured, we need to connect them to our already existing railway networks, allowing goods and personell to travel easily through out our entire nation, instead of just the old parts of our Kingdom"
 FIN_r56rp_independence_war: "Independence War"
 FIN_r56rp_independence_war_desc: "We had hoped it would not come to this. But, it seems that our Overlords have forgotten our contributions and think we are mere pawns. So, we will fight them for our independence and we will make them bleed"
 FIN_r56rp_strengthen_our_alliance: "Strengthen our Alliance"
 FIN_r56rp_strengthen_our_alliance_desc: "Now, with our newfound independence we are free to look outwards once more, untethered by a foreign crown. But, that does not mean we can abandon our allies, by working together with them, we will be able to further strengthen our alliance and forge a truly unbreakable bond between two nations"

#Communist
 FIN_r56rp_appeal_to_moscow: "Appeal to Moscow"
 FIN_r56rp_appeal_to_moscow_desc: "It is clear to us that the need for a proper revolution is now stronger than ever. However, if we wish to succeed we need to appeal to the regime in Moscow so that they can provide the necessary support for our revolution."
 FIN_r56rp_the_second_finnish_revolution: "The Second Finnish Revolution"
 FIN_r56rp_the_second_finnish_revolution_desc: "The time is now, this time, the Whites are disorganized and illprepared and we need to strike now before they have a chance to reorganize themselves, lest we find ourselves shot by firing squads."
 FIN_r56rp_root_out_counter_revolutionaries: "Root Out Counter Revolutionaries"
 FIN_r56rp_root_out_counter_revolutionaries_desc: "With the Revolution successful we now need to root out those who could seek to destabilize us furhter. Gather up every major politician of the old regime, gather the old guard and have them shot."
 FIN_r56rp_stabilize_the_new_regime: "Stabilize the New Regime"
 FIN_r56rp_stabilize_the_new_regime_desc: "The first step to properly securing the Revolution in Finland is to stabilize and secure the new government's position. By launching a two year program we should be able to root out the ones in hiding where they will either see the folly of their ways or face trial."
 FIN_r56rp_establishment_of_the_fssr: "Establishment of the FSSR"
 FIN_r56rp_establishment_of_the_fssr_desc: "We owe the success of our revolution to the Soviet Union, with this in mind, we shall therefore proclaim the estblishment of the Finnish Soviet Socialist Republic. Together with the Soviets, the Revolution can not fail."
 FIN_r56rp_found_the_finnish_red_army: "Found the Finnish Red Army"
 FIN_r56rp_found_the_finnish_red_army_desc: "To help spread the Revolution beyond the borders of Eastern Europe we have to establish a Revolutionary Army, one that can prop up the normal Finnish Armed forces and act as the Vanguard of the Revolution."
 FIN_r56rp_commissariat_of_finnish_affairs: "Commissariat of Finnish Affairs"
 FIN_r56rp_commissariat_of_finnish_affairs_desc: "With the Government secure we have more work to do to ensure prosperity within our borders. Therefore the Commissariat of Finnish Affairs will be established as the main political hub from every decision will be taken that deals with Finnish matters."
 FIN_r56rp_pc_of_heavy_industry: "PC of Heavy Industry"
 FIN_r56rp_pc_of_heavy_industry_desc: "There is currently a lack of knowledge of Heavy Industry here in Finland and we must ratify this. By establishing the PC of Heavy Industry we should be able to draw knowledge from the Soviets and create a new eocnomy that'll be able to keep the wheels of the revolution turning."
 FIN_r56rp_socialist_universities: "Socialist Universities"
 FIN_r56rp_socialist_universities_desc: "With the minds of the youth no longer shackled by Capitalists and Fascists we can ensure that they get access to the education and knowledge they require. Together with these young minds we will be able to propell our nation forward into the future."
 FIN_r56rp_establish_the_finnish_guard_corps: "Establish the Finnish Guard Corps"
 FIN_r56rp_establish_the_finnish_guard_corps_desc: "With the foundation of the Finnish Red Army we have secured our safety, but now we need to ensure that we have the ability to push the Revolution forward, to help it spread against the enemies of the Revolution."
 FIN_r56rp_remodel_the_constitution: "Remodel the Constitution"
 FIN_r56rp_remodel_the_constitution_desc: "The first order of business after the establishment of the Finnish Soviest Socialist Republic has to be to remodel our constitution into a manner that'll more properly align with the Revolution and the Soviet Union."
 FIN_r56rp_propose_karelo_finnish_ssr: "Propose a Karelo-Finnish SSR"
 FIN_r56rp_propose_karelo_finnish_ssr_desc: "To our east lay the lands of Karelia, the Karelians and us Finns have long been brothers and while they are in good hands, we should float the idea of forming a Karelo-Finnish SSR to the regime in Moscow."
 FIN_r56rp_introduce_collectivization: "Introduce Collectivization"
 FIN_r56rp_introduce_collectivization_desc: "The introduction of collectivization has proven to be a great boon to the Soviet Union, their industrial output since it was implemented has sky-rocketed and it tells us that we need to implement a version of it ourselves."
 FIN_r56rp_into_scandinavia: "Into Scandinavia"
 FIN_r56rp_into_scandinavia_desc: "With our nation stabilized, our borders defended and our economy strengthening, we need to look at spreading the revolution to Scandinavia. The Swedes, Danes and Norwegians all claim to be Pro-Workes, but still they suppress them. We must end this charade."
 FIN_r56rp_develop_sweden: "Develop Sweden"
 FIN_r56rp_develop_sweden_desc: "With our control over Sweden solidifed, we can help stabilize the country and prepare them for our next objective."
 FIN_r56rp_develop_norway: "Develop Norway"
 FIN_r56rp_develop_norway_desc: "Now that we border the Atlantic, we have to develop the Norwegian lands to ensure that they are ready for the coming shift in politics and that they are prepared to defend the Revolution should the enemy try and come ashore."
 FIN_r56rp_develop_denmark: "Develop Denmark"
 FIN_r56rp_develop_denmark_desc: "Denmark is the gateway of the Baltic and thus we have to further increase their industrial capability so they are capable of withstanding any threats against the Revolution."
 FIN_r56rp_form_the_nssf: "Form the N.S.S.F"
 FIN_r56rp_form_the_nssf_desc: "The idea of a unified Nordic State has always been a pipedream, but here we are, at the cusp of achieving something great. By uniting our nations into one we'll create the Nordic Soviet Socialist Federation and be the revolutionary beacon in the North."

# R56RP Events
# Monarchist
 sweden_auth_r56rp.1.a:0 "Instead of Annexation, how about a personal union?" # RP Specific option for Sweden Event
 sweden_auth.14.t:0 "[FROM.GetNameDefCap] accepts proposal"
 sweden_auth.14.d:0 "While we would have preferred to remain an independent nation, this is probably the better outcome as to avoid having to fight a bloody war. Preparations are being made for the coronation of Prince Bertil to become King Bertil I of Finland as we speak, though if we are fortunate, we may have an opportunity in the future to separate from this forced bond"
 sweden_auth.14.a:0 "It beats fighting a bloody war"
 FIN_r56rp_monarchist.1.t:0 "Dealings with the Conservatives"
 FIN_r56rp_monarchist.1.d:0 "When the Great War came to an end on the Eastern Front, Finland was for a brief period a Monarchy, under the House of Hesse. However the following Civil War that saw the Reds and the Whites fight for control of the country, and with the defeat of Germany, the idea of a German Monarch on the throne of Finland was no longer a viable option. So, a Republic was established, and the ideas of a Kingdom of Finland was put away along with the Kaiser.\n\nHowever, times are changing and the current government doesn't have the backing from the people it should. By reaching out to conservative elements in the country, we should be able to strike a deal with them and gain their support."
 FIN_r56rp_monarchist.1.a:0 "By limiting Crown Authority, we should be able to win them over."
 FIN_r56rp_monarchist.1.b:0 "What's the King's job if not to rule?"
 FIN_r56rp_monarchist.2.t:0 "[FROM.GetNameDefCap] Proposes Political Union"
 FIN_r56rp_monarchist.2.d:0 "With the [FROM.GetNameDef] having crowned the Swedish Prince [FROM.GetLeader], they have now proposed a partnership between our two nations to help provide stability here in Northern Europe. The Union would see [FROM.GetNameDef] take on a more junior role, while maintaining its own Army, Navy and Airforce.\n\nWhile a political union between our two nations would definitely be beneifitial, it could also be seen as a powergrab by the [SOV.GetAdjective]s, and it could provoke them into action against us."
 FIN_r56rp_monarchist.2.a:0 "We are stronger together"
 FIN_r56rp_monarchist.2.b:0 "A noble cause, but, alas, we shall not"
 FIN_r56rp_monarchist.3.t:0 "[FROM.GetNameDefCap] Agrees to the Union"
 FIN_r56rp_monarchist.3.d:0 "[FROM.GetNameDefCap] has agreed to our proposal, with this, we will be able to focus on our internal affairs more before our inevitable clash with the [SOV.GetAdjective]s."
 FIN_r56rp_monarchist.3.a:0 "Terrific, together, we are stronger!"
 FIN_r56rp_monarchist.4.t:0 "[FROM.GetNameDefCap] Declines the Proposal"
 FIN_r56rp_monarchist.4.d:0 "[FROM.GetNameDefCap] has, perhaps fortunately so, declined our proposal of a political union between our two states. This means that we can not count on the [SWE.GetAdjective]s should the [SOV.GetAdjective]s try and come for us once more."
 FIN_r56rp_monarchist.4.a:0 "We should still maintain good relations with them."
 FIN_r56rp_monarchist.5.t:0 "Rallying Public Support"
 FIN_r56rp_monarchist.5.d:0 "The biggest hurdle that we face internally will be public support. We have to sell the idea of a monarchy to the people once more, one that is not like the former Russian Empire, but one that is forged with the heart of the Finnish people at its core.\n\nWith smart investments and thorough planning, we'll be able to get the idea of a monarch as the head of Finland into the hearts and minds of everyone."
 FIN_r56rp_monarchist.5.a:0 "For King and Country"
 FIN_r56rp_independence.1.t:0 "[FROM.GetNameDefCap] Guarantees Alliance Post-Independence"
 FIN_r56rp_independence.1.d:0 "Today, an envoy from [FROM.GetNameDef] arrived in [ROOT.GetCapital] to discuss the matter of independence. The envoy made a great effort to ensure us about [FROM.GetNameDef]s loyalty to our alliance and that they would not seek to distance themselves from us should they have their independence returned."
 FIN_r56rp_independence.1.a:0 "Hmm, very interesting"
 FIN_r56rp_independence.2.t:0 "[FROM.GetNameDefCap] Offers Absolute Neutrality Post-Independence"
 FIN_r56rp_independence.2.d:0 "Today, an envoy from [FROM.GetNameDef] arrived in [ROOT.GetCapital] to discuss the matter of independence. The envoy made a great effort to ensure that should [FROM.GetNameDef] get their independence, they will adopt a stance of Absolute Neutrality, effectively cutting down on the front to the East should we end up at war with the [SOV.GetAdjective]s."
 FIN_r56rp_independence.2.a:0 "Quite intriguing"
 FIN_r56rp_independence.3.t:0 "[FROM.GetNameDefCap] Demands Independence"
 FIN_r56rp_independence.3.d:0 "Today [FIN.GetLeader] met with [ROOT.GetLeader] in private, where he expressed the urge for [FIN.GetNameDef] to become independent. When the talk between the two leaders seemed to end up in a stalemate, [FIN.GetLeader] moved to depart, but before leaving they gave an ultimatum. Either leave [FIN.GetNameDef] or the consequences may be dire."
 FIN_r56rp_independence.3.a:0 "Who does he think he is?"
 FIN_r56rp_independence.3.b:0 "It is not worth it"
 FIN_r56rp_independence.4.t:0 "[FROM.GetNameDefCap] Lobbies for Independence"
 FIN_r56rp_independence.4.d:0 "Today [FIN.GetLeader] met with [ROOT.GetLeader] in private, where he expressed the urge for [FIN.GetNameDef] to become independent. As the meeting between the two leaders dragged on, there seemed to be a hint of optimism coming from [FIN.GetLeader], and as he left, he wished [ROOT.GetLeader] well and hoped for a prosperous future between our two nations."
 FIN_r56rp_independence.4.a:0 "Very well, they shall have it"
 FIN_r56rp_independence.4.b:0 "They are more useful as our subject"
 FIN_r56rp_independence.5.t:0 "[FROM.GetNameDefCap] Grants us Independence"
 FIN_r56rp_independence.5.d:0 "Today, our envoy to [FROM.GetCapital] has brought with him joyous news, [FROM.GetNameDef] has agreed to our request and we have been granted independence, we are our own nation once more and the people are celebrating this joyous occasion. Though the current matter at hand is that we are now responsible for our own foreign policy once more and will have to deal with what was agreed upon between us and our former Overlords."
 FIN_r56rp_independence.5.a:0 "Splendid News!"
 FIN_r56rp_independence.6.t:0 "[FROM.GetNameDefCap] Denies our Independence"
 FIN_r56rp_independence.6.d:0 "Today, our envoy to [FROM.GetCapital] has brought unfortunate news back with them. [FROM.GetNameDefCap] has refused our request for independence and we are told to remember our place in the larger scheme in Europe.\n\nThese news have not gone down well among our people, and people are calling for a rebellion against our Overlords."
 FIN_r56rp_independence.6.a:0 "Well, we have one way forward then."
 
# Communist
 FIN_r56rp_ssr.1.t:0 "[FROM.GetNameDefCap] Proposes Unification with Karelia"
 FIN_r56rp_ssr.1.d:0 "[FROM.GetLeader] arrived in [ROOT.GetCapital] with a proposal of unifying [FROM.GetNameDef] with the lands to their east, underlining the fact that the Karelian people has a lot in common with their Finnish brethren. While we would lose out on potential workers, it would help bolster [FROM.GetNameDef] and ensure their loyalty."
 FIN_r56rp_ssr.1.a:0 "A Novel Concept, sure"
 FIN_r56rp_ssr.1.b:0 "We will keep our land"
 FIN_r56rp_ssr.2.t:0 "[FROM.GetNameDefCap] Unites us with Karelia"
 FIN_r56rp_ssr.2.d:0 "[FROM.GetLeader] has agreed to our proposal of unifying [ROOT.GetNameDef] with the Karelian lands to our east. The local administration has been instructed to now report to [ROOT.GetCapital] instead of [FROM.GetCapital] for any future requests."
 FIN_r56rp_ssr.2.a:0 "Marevlous!"
 FIN_r56rp_ssr.3.t:0 "[FROM.GetNameDefCap] Retains control over Karelia"
 FIN_r56rp_ssr.3.d:0 "[FROM.GetLeader] has unfortunately declined our request for the lands to our east. Citing that the amount of paperwork that would have to be done would not be worth the final outcome."
 FIN_r56rp_ssr.3.a:0 "Unfortunate"
FIN_r56rp_ssr.4.t:0 "[FROM.GetNameDefCap] Proposes Joint Invasion of [SWE.GetNameDef]"
FIN_r56rp_ssr.4.d:0 "We have received word from [FROM.GetLeader] that they are seeking to spread the revolution further and out of their borders. They are seeking to spread it to their fellow Nordic Countries and this plan proposes a joint invasion of [SWE.GetNameDef], it would put us at risk at angering the rest of Europe however, but the revolution should not be halted just because of what the oppressive Capitalists might think"
FIN_r56rp_ssr.4.a:0 "A reasonable suggestion"
FIN_r56rp_ssr.4.b:0 "Our attention is needed elsewhere"
FIN_r56rp_ssr.5.t:0 "[FROM.GetNameDefCap] Agres to Invasion Plan"
FIN_r56rp_ssr.5.d:0 "Greetings, [FIN.GetLeader], we have received word from [FROM.GetLeader], our invasion plan of [SWE.GetNameDef] has been approved and the [FROM.GetAdjective] army is preparing to launch their invasion."
FIN_r56rp_ssr.5.a:0 "Prepare the Troops!"
FIN_r56rp_ssr.6.t:0 "[FROM.GetNameDefCap] Declines the Proposed Plan"
FIN_r56rp_ssr.6.d:0 ""
FIN_r56rp_ssr.6.a:0 "We shall bide our time"
