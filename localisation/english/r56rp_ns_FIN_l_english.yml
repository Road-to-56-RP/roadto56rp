FIN_r56rp_ssr.11.t:0 "[FROM.GetNameDefCap] Requests Controll over [SWE.GetNameDef]"
FIN_r56rp_ssr.11.d:0 "With the conquest of [SWE.GetNameDef] now complete, [FROM.GetNameDef] has requested controll over the territory, to allow us to focus on other matters while they tend to the proper integration of these new lands into our Union."
FIN_r56rp_ssr.11.a:0 "It's their administrative burden"
FIN_r56rp_ssr.11.b:0 "We will controll them from [ROOT.GetCapital]"
FIN_r56rp_ssr.12.t:0 "[FROM.GetNameDefCap] Transfers Controll over [SWE.GetNameDef]"
FIN_r56rp_ssr.12.d:0 "[FROM.GetCapital] has informed us that they will be transferring over the territory that was just liberated from the oppresive fascists and capitalists over to our supervision. This will allow us to set our plan of forming the N.S.S.F into motion. "
FIN_r56rp_ssr.12.a:0 "We shall set to work"
FIN_r56rp_ssr.13.t:0 "[FROM.GetNameDefCap] Declines the Request"
FIN_r56rp_ssr.13.d:0 "[FROM.GetLeader] has unfortunately declined our reqeuest, thus preventing us from progressing with our plan to establish the N.S.S.F"
FIN_r56rp_ssr.13.a:0 "Alas, it was worth a shot"
