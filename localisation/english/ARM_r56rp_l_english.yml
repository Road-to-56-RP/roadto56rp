  ARM_r56rp_uniting_the_caucasian_peoples: "Uniting the Caucasian Peoples"
  ARM_r56rp_uniting_the_caucasian_peoples_desc: ""

  # Events
  ARM_r56rp_propose_unification_event.1.t: "[FROM.GetNameDefCap] proposes reunification of Transcaucasia"
  ARM_r56rp_propose_unification_event.1.d: "Following the dissolution of the fourth founding member of what we know as the Soviet Union, we had hoped that the three constituent republics would be able to prosper on their own. However it hasn't exactly panned out as intended.\n\nNow the Government in Yerevan is proposing that we restore the Transcaucasian SFSR, but with a different goal. One that is to expand our influence within the Caucasus Region.\n\nHow should we proceed?"
  ARM_r56rp_propose_unification_event.1.a: "Why not, means less paperwork for Moskwa"
  ARM_r56rp_propose_unification_event.1.b: "Eh, we've already tried this once"
  ARM_r56rp_propose_unification_event.2.t: "[FROM.GetNameDefCap] agrees to our proposal"
  ARM_r56rp_propose_unification_event.2.d: "In a not too surprising turn of events, the Government in Moskwa has seen it fitting to once more reestablish Transcaucasian SFSR, however, this time keeping our overarching goal in mind of reuniting all Caucasus' people into one state."
  ARM_r56rp_propose_unification_event.2.a: "Splendid news!"
  ARM_r56rp_propose_unification_event.3.t: "[FROM.GetNameDefCap] disagrees with our proposal"
  ARM_r56rp_propose_unification_event.3.d: "Unfortunately for us, the Government in Moskwa has announced that they will not restore the Transcaucasian SFSR, saying that it was dissolved for a reason and that we will just have to accept that fact."
  ARM_r56rp_propose_unification_event.3.a: "Alas, we tried."
