l_english:

 ROM_r56rp_design_and_equipment_license: "Axis Design and Equiment License"
 ROM_purchase_axis_designs_and_equipment: "Purchase Axis Designs and Equipment Licenses"
 ROM_purchase_axis_designs_and_equipment_desc: "While we have isolated ourselves from most of the West when it comes to Materiel research, we can still rely on the Germans and the Italians. By purchasing official licenses from them, we will be able to provide our armed forces with modern equipment while we are still catching up to the rest of the World."
 ROM_joint_oil_exploitation: "Joint Oil Exploitation"
 ROM_joint_oil_exploitation_desc: "Together with the Italians and the Germans, we will be able to further expand our industrial capabilities when it comes to our rich oil fields."
ROM_r56rp_oppose_tatarescus_regime: "Oppose Tatarescu's Regime"
ROM_r56rp_oppose_tatarescus_regime_desc: "It is clear to us that Tatarescu and his regime will be the end of Greater Romania as we know it. His policies are blatantly in favour of the Monarchy while the lower-class is suffering from poverty and hardships."
ROM_r56rp_gather_the_dissenters: "Gather the Dissenters"
ROM_r56rp_gather_the_dissenters_desc: "Despite our various differences, we have to unify into a singular block and oppose Tatarescu and the Monarchy, wether we are Iron Guard or Revolutionary, we have a common goal."
ROM_r56rp_critize_the_regime: "Critize the Regime"
ROM_r56rp_critize_the_regime_desc: "By making public statements of disapproval of the current regime, we will be able to rally more to our cause and away from the Monarchy and his Pet Tatarescu."
ROM_r56rp_radicalize_the_opposition: "Radicalize the Opposition"
ROM_r56rp_radicalize_the_opposition_desc: "As we grow in strength and our voices have grown louder, it is clear that the current regime will not see reason and instead we will have to take to more radical means."
ROM_r56rp_denounce_tatarescus_ideals: "Denounce Tatarescu's Ideals"
ROM_r56rp_denounce_tatarescus_ideals_desc: "Tatarescu's 'ideal' Romania, is unfortunately one that is not meant for the Common Folk, their blatant favourism of the Upper Class is what is going to be the end of our nation."
ROM_r56rp_smear_campaign_against_the_crown: "Smear Campaign Against the Crown"
ROM_r56rp_smear_campaign_against_the_crown_desc: "By launching several smear campaigns aimed that the Royal family, we can show that we, the people of Romania, do not want them here anymore. That they are no longer welcome."