LAT_r56rp_foreign_servitude_category: "Foreign Servitude"
LAT_r56rp_foreign_servitude_category_desc: "It has become clear to us that if we are to survive the storm that is looming on the horizon, we will have to bow to the §Y[GER.GetAdjective]s§! as they seem poised to be the new masters of §YEurope§!. But, before they come and force us to submit, we could appoint a Pro-§Y[GER.GetAdjective]§! regime that'll see us stand side-by-side with them and not be swept along with the rest of §YEurope§!.\n\nWe could also utilize our contacts to reach out to the §YWhite Russian Exiles§! if the rumors are to be believed, they may attempt to restore order to their former homeland in the east.\n\n§R---Attention---§!\nSelecting a §YPolitical Path§! will remove this §YDecision§! and prevent you from accessing the Pro-§YGerman§! or the Pro-§YRussian§! Focus Trees."
