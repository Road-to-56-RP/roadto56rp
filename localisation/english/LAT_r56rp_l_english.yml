### Events
LAT_r56rp_ger_junta.1.t: "[FROM.GetNameDefCap] Proposes Unification"
LAT_r56rp_ger_junta.1.d: "Today, an envoy from [LAT.Capital.GetCapitalVictoryPointName] has arrived with a proposal of unification between our nations. They stress the importance of unifying our nations to try and prevent further Russian Dominance in the Baltic region, but based on the phrasing, this proposal doesn't seem to come with an option, whether we want to or not, it seems they are poised to strike, what should we do?"
LAT_r56rp_ger_junta.1.a: "Hmm... We agree"
LAT_r56rp_ger_junta.1.b: "No, we do not agree"
LAT_r56rp_ger_junta.2.t: "[FROM.GetNameDefCap] Agrees"
LAT_r56rp_ger_junta.2.d: "Great news, [FROM.GetNameDef] has agreed to our proposal and we are now in the process of transferring all governmental control over to our capital. Their current standing miltiary as well as the limited Naval assets are being integrated into our armed forces as we speak"
LAT_r56rp_ger_junta.2.a: "Terrific"
LAT_r56rp_ger_junta.3.t: "[FROM.GetNameDefCap] Disagrees"
LAT_r56rp_ger_junta.3.d: "Unfortunate news, [FROM.GetNameDef] has not agreed to our proposal and thus are moving their forces to our borders and are preparing to strike shortly. We have already dispatched our Armed Forces and we are ready to strike in just a few hours"
LAT_r56rp_ger_junta.3.a: "Oh no, what a shame"
LAT_r56rp_ger_junta.4.t: "[FROM.GetNameDefCap] Demands Ruthenian Lands"
LAT_r56rp_ger_junta.4.d: "Today, an envoy from [LAT.Capital.GetCapitalVictoryPointName] has arrived with a demand, give up the Polish Ruthenian Lands we currently hold, or face war. How should we respond? They currently have the backing of the [GER.GetAdjective] Government, and that may cause some issues"
LAT_r56rp_ger_junta.4.a: "It's best to... Agree"
LAT_r56rp_ger_junta.4.b: "No, we do not plan to give up any land"
LAT_r56rp_ger_junta.5.t: "[FROM.GetNameDefCap] Transfers Demanded Land"
LAT_r56rp_ger_junta.5.d: "[FROM.GetNameDefCap] has fortunately agreed to part with the Ruthenian lands that we have demanded from them, this means that we do not have to fight a potentially prolonged war against them"
LAT_r56rp_ger_junta.5.a: "Perfect, no blood shed unnecessarily"
LAT_r56rp_ger_junta.6.t: "[FROM.GetNameDefCap] Stands Defiant"
LAT_r56rp_ger_junta.6.d: "[FROM.GetNameDefCap] has unfortunately refused to part with the Ruthenian lands that we have demanded from them, this means that we will have to fight for the lands that we have demanded from them. Thus, our armed forces are now poised to strike them"
LAT_r56rp_ger_junta.6.a: "Oh no, let's get this dealt with, shall we?"
LAT_r56rp_purchase_stugs.1.t: "Reichs Ministry of Armaments delivers"
LAT_r56rp_purchase_stugs.1.d: "Early this morning, a shipment arrived via train that carried a sizeable delivery of the Assault Guns that we ordered. It seems that the Reichs Ministry isn't the most pleased with having to ship this kind of equipment via train, so we should not be surprised if they suddenly decide that it is no longer worth the effort"
LAT_r56rp_purchase_stugs.1.a: "Splendid!"
LAT_r56rp_purchase_stugs.2.t: "Reichs Ministry of Armaments Last Delivery"
LAT_r56rp_purchase_stugs.2.d: "It seems that the Reichs Ministry of Armaments have had enough with having to ship the Assault Guns along the railways and has told us that this will be the last shipment of Assault Guns that we will be given and that we should set up our own local production of them instead"
LAT_r56rp_purchase_stugs.2.a: "Oh... okay"
LAT_r56rp_purchase_tanks.1.t: "Reichs Ministry of Armaments delivers"
LAT_r56rp_purchase_tanks.1.d: "Early this morning, a shipment arrived via train that carried a sizeable delivery of the Heavy Tanks that we ordered. It seems that the Reichs Ministry isn't the most pleased with having to ship this kind of equipment via train, so we should not be surprised if they suddenly decide that it is no longer worth the effort"
LAT_r56rp_purchase_tanks.1.a: "Splendid!"
LAT_r56rp_purchase_tanks.2.t: "Reichs Ministry of Armaments Last Delivery"
LAT_r56rp_purchase_tanks.2.d: "It seems that the Reichs Ministry of Armaments have had enough with having to ship the Heavy Tanks along the railways and has told us that this will be the last shipment of Heavy Tanks that we will be given and that we should set up our own local production of them instead"
LAT_r56rp_purchase_tanks.2.a: "Oh... okay"
LAT_r56rp_sov_zastava.1.t: "[FROM.GetNameDefCap] Press for Border Adjustments"
LAT_r56rp_sov_zastava.1.d: "Today an envoy from Riga arrived, he requested a private meeting with the head of our government and while we do not have all the details of what was said, or how it was said, we do know what and who he represented. We have been expecting the Russian-backed Baltic Government to visit us and now, they have. They propose a border adjustment that sees us give up our land up to the Neman River, which would include cities like Grodno, Wilno and Wilejka, they seem to be ready for a confrontation, what shall we do?"
LAT_r56rp_sov_zastava.1.a: "Fine, we shall relent, for now..."
LAT_r56rp_sov_zastava.1.b: "Not one inch of Polish Clay shall go to the Russian Puppets!"
LAT_r56rp_naval_burden.1.t: "[FROM.GetNameDefCap] Offers to take the Naval Burden"
LAT_r56rp_naval_burden.1.d: "Earlier today we got a message from [FROM.GetNameDef], saying that they are prepared to leverage their new leadership's experience with Naval Warfare and Ship Construction to assume the burden of protecting our western Coastlines from potential aggression. This would allow us to focus on other matters, such as aviation or our land forces. What should our response be?"
LAT_r56rp_naval_burden.1.a: "A splendid idea!"
LAT_r56rp_naval_burden.1.b: "We'd rather not..."