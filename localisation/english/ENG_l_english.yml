  r56_eng.1.t:0 "Fascism alone can preserve the Peace!"
  r56_eng.1.desc:0 "Fascism means peace because fascism alone fights the true cause of war. A strong autarkic policy would enable to escape the unwinnable competition for markets that have caused so many wars. This is why peace and Empire are compatible. They go hand in hand as a way to ensure economic independence!"
  r56_eng.1.a:0 "We will prevent war!"

  r56_eng.2.t:0 "On Foreign Wars"
  r56_eng.2.desc:0 "Britons must fight for Britain only! The sight of the sons of Britain leaving our shores in order to die for foreign quarrels must become an entry if your history books. Britons must only fight for Britain and the defense of the Empire."
  r56_eng.2.a:0 "We will not die on foreign shores!"

  r56_eng.3.t:0 "British Military Exiles Demand Asylum"
  r56_eng.3.desc:0 "Former members of the British military fleeing the communists have arrived and are requesting asylum. Actually they could certainly serve our armed forces instead."
  r56_eng.3.a:0 "We always need experienced personel!"

  r56_eng.4.t:0 "Survivors of the Royal Family are Taking Refuge in our Country"
  r56_eng.4.desc:0 "Escaping from the tragic events which decimated the Royal Family, the survivors have requested to be able to establish themselves in our country, with the hope that they would one day be able to restore the monarchy in Britain."
  r56_eng.4.a:0 "This is not Westminster but we will do our best."

  r56_eng.7.t:0 "The Elections of [GetYear]"
  r56_eng.7.d:0 "It has been 5 years since the last elections, and it would appear that once again it is time for the people of [ENG.GetNameDef] to vote for their government.\n\nIn the past years, the Labour Party has been a harsh critic of the Conservative's support for appeasement, with the Conservative Party defending their actions by claiming that [ENG.GetNameDef] was not ready to fight a war at the time. Otherwise, the parties' are following their usual campaigns, Labour's social democratic platform clashing against the Conservative's more right-wing policies.\n\nWho will the [ENG.GetAdjective] people decide fit to lead them?"
  r56_eng.7.a:0 "The Conservatives know what they are doing."
  r56_eng.7.b:0 "Labour will drive [ENG.GetNameDef] into the future!"

  r56_eng.8.t:0 "Wartime Elections?"
  r56_eng.8.d:0 "5 years have passed since the last elections, and the time to vote has arrived. However, [ENG.GetNameDef] finds itself fighting a war against a major power, and many believe holding elections at this time would only serve to destabilize the nation during it's darkest hour.\n\nWhat should be done?"
  r56_eng.8.a:0 "The people have a right to be heard."
  r56_eng.8.b:0 "It can wait until we achieve victory."

  r56_eng.9.t:0 "[ENG.GetLeader] Wins [ENG.GetAdjective] Elections"
  r56_eng.9.d.a:0 "It has been 5 years since the last [ENG.GetAdjective] elections, and yesterday the [ENG.GetAdjective] people once again went to the polls to decide the future of their government.\n\nAs the ballots have been counted, it appears that the Labour Party under Clement Atlee has secured power, promising to stand against appeasement and progress social reforms in [ENG.GetAdjective] society.\n\nTime will tell if the new [ENG.GetAdjective] government can hold on."
  r56_eng.9.d.b:0 "It has been 5 years since the last [ENG.GetAdjective] elections, and yesterday the [ENG.GetAdjective] people once again went to the polls to decide the future of their government.\n\nAs the ballots have been counted, it appears that the Conservative Party under [ENG.GetLeader] has secured power, with it's campaign being the continuation of protectionist policies and the maintenance of the Empire.\n\nTime will tell if the new [ENG.GetAdjective] government can hold on."
  r56_eng.9.a:0 "A good show."
  r56_eng.9.b:0 "Will he differ from the previous administration?"

  r56_eng.11.t:0 "Evacuating the Government?"
  r56_eng.11.d:0 "With the fall of London to [126.controller.GetAdjective] troops, and the nearing capitulation of the British government, we must come to the decision on whether the government and military will evacuate to our dominions or continue to fight to the end."
  r56_eng.11.a:0 "They will live to fight another day."
  r56_eng.11.b:0 "We shall return. (Play as Canada)"
  r56_eng.11.c:0 "We shall fight to the end!"

  r56_eng.12.t:0 "British Exiles Arrive in [Capital.GetCapitalVictoryPointName]"
  r56_eng.12.d:0 "Following the collapse of the British mainland, the royal family and exiles from the British government have retreated to our nation to continue the fight. However, with our remaining armies retreating from Europe, anti-war protests grow louder and louder, grinding the country to a halt."
  r56_eng.12.a:0 "We shall continue the fight!"
  r56_eng.12.b:0 "Perhaps we must admit defeat."

  r56_eng.13.t:0 "Collapse of the British Mainland"
  r56_eng.13.d:0 "Following the fall of London and the retreat of the Royal Family, the end of the Empire as we know it has come. We have assumed control over neighboring British territories, and we await [faction_leader.GetNameDef]'s decision on whether to continue fighting."
  r56_eng.13.a:0 "An end of an era."
 
  r56_eng.14.t:0 "Collapse of the British Mainland"
  r56_eng.14.d:0 "Following the fall of London and the retreat of the Royal Family, the end of the Empire as we know it has come. We have assumed control over neighboring British territories, but the majority of our populace is calling for us to leave the collapsing empire behind and declare independence."
  r56_eng.14.a:0 "We will stay with our loyal allies."
  r56_eng.14.b:0 "India is finally free!"

   
  r56_eng.15.t:0 "Collapse of the British Mainland"
  r56_eng.15.d:0 "Following the fall of London and the retreat of the Royal Family, the end of the Empire as we know it has come. We have assumed control over neighboring British territories, but the majority of our populace is calling for us to leave the collapsing empire behind and declare independence."
  r56_eng.15.a:0 "We will stay with our loyal allies."
  r56_eng.15.b:0 "We see no reason to continue this losing battle."

  r56_eng.16.t:0 "Seizing Las Malvinas?"
  r56_eng.16.d:0 "Following the fall of London and the retreat of the Royal Family, the overseas territories of the British empire are ripe for the taking. we could use this opportunity to seize the islands of the Malvinas and South Georgia, and the Canadians might not even fight back, however such an operation carries the risk of a retaliation."
  r56_eng.16.a:0 "Las Malvinas son Argentinas!"
  r56_eng.16.b:0 "Let us not start a war we cannot win."

  r56_eng.17.t:0 "[ARG.GetNameDefCap] Seizes the Falkland Islands"
  r56_eng.17.d:0 "Seeing our weakness, [ARG.GetLeader] has launched a military operation to take control of the Falkland Islands. It might be wise to not retaliate, as the recent events have caused major instability in our nation."
  r56_eng.17.a:0 "We will prove them wrong!"
  r56_eng.17.b:0 "Sadly, their assumption was correct."

  r56_eng.18.t:0 "Collapse of the British Empire"
  r56_eng.18.d:0 "With the fall of London and the inevitable capitulation of the British mainland, the government, military, and royal family of the United Kingdom have decided to evacuate from the mainland.\n\nAlthough the King has addressed from [ENG_commonwealth_successor.Capital.GetCapitalVictoryPointName] that the Empire will continue to fight until the Liberation of the mainland, many see this as the end of the British Empire as we know it."
  r56_eng.18.a:0 "The sun has finally set."

  r56_eng.19.t: "$ENG_winston_churchill$ Retires"
  r56_eng.19.d: "After intensified health qualms, Sir $ENG_winston_churchill$ has retired as head of the Conservative Party, with $ENG_anthony_eden$ taking over his duties. Letting $ENG_winston_churchill$ retire in favor of $ENG_anthony_eden$ had been considered earlier, however the latter had himself been suffering from health issues."
  r56_eng.19.a: "He will be missed."
 
  ENG_collapse_of_the_empire_tt:0 "§YThe government and royal family will retreat to our largest dominion, with our overseas territories and part of our army and navy being seized by other nations of our empire, which will gain independence§!."
  ENG_got_territories_from_collapse:0 "§YWe will assume control over neighboring territories of the Empire§!."


  ENG_opposition_to_the_national_government:0 "Opposition to the National Government"
  ENG_opposition_to_the_national_government_desc:0 "The national government has ignored the plead of the people, it is time to make our voice heard!"
