## Miyagi
 ### ELECTION START ###
 ENG_r56rp_general_election_emergancy:0 "General Election Emergency"
 ENG_r56rp_general_election_emergancy_desc:0 "The fragile political order is cracking. Britain cannot continue under an unstable coalition and a crisis of legitimacy. A national emergency election must be called, and quickly — before the country sleeps into chaos or authoritarianism rises from the shadows."

 ENG_r56rp_secure_funds:0 "Secure Campaign Funding"
 ENG_r56rp_secure_funds_desc:0 "The upcoming election will be fought not only with ideas, but with money. Labour must secure funding fast — through donors, unions, and sympathetic institutions — before our opponents drown us in a tide of Conservative cash."

 ENG_r56rp_begin_election_campaign:0 "Begin the Election Campaign"
 ENG_r56rp_begin_election_campaign_desc:0 "The battle for Britain begins. Labour launches its campaign with fiery speeches, mass rallies, and a promise of a new Britain for the working class. The establishment trembles — the people are awakening."

 ENG_r56rp_who_to_support_election:0 "Decide Electoral Alignment"
 ENG_r56rp_who_to_support_election_desc:0 "Within Labour's ranks, factions battle for influence. Should we appeal to moderates? Unite with Liberals? Stand firm on socialist principles? The future of Britain depends on the path we choose."

 ### ELECTION OUTCOME PATHS ###
 ENG_r56rp_atlee_cabinet:0 "Attlee Cabinet"
 ENG_r56rp_atlee_cabinet_desc:0 "Clement Attlee emerges as the unifying figure Britain desperately needs. Calm, principled, and quietly determined, his cabinet represents a government ready to rebuild a battered nation with integrity and purpose."

 ENG_r56rp_converstive_cabinet:0 "Conservative Cabinet"
 ENG_r56rp_converstive_cabinet_desc:0 "Against all expectations, Conservative influence surges within Parliament, and a right-leaning coalition forms. Their cabinet embodies caution, tradition, and a deep suspicion of sweeping Labour reforms."

 ENG_r56rp_liberal_shock_cabinet:0 "Liberal Shock Cabinet"
 ENG_r56rp_liberal_shock_cabinet_desc:0 "A stunning political upset sees the Liberals punch far above their weight, securing enough leverage to form an unexpected cabinet. Britain braces for experimentation and political unpredictability."

 ### EARLY LABOUR GOVERNANCE ###
 ENG_r56rp_labour_at_the_helm:0 "Labour at the Helm"
 ENG_r56rp_labour_at_the_helm_desc:0 "With Labour formally in charge, the direction of the nation begins to shift. Reforms, welfare, and renewed industrial policy take shape as the working class finally has a government fighting in its corner."

 ENG_r56rp_the_peoples_mandate:0 "The People's Mandate"
 ENG_r56rp_the_peoples_mandate_desc:0 "A broad and enthusiastic wave of support propels Labour's legitimacy. The British people demand a fairer tomorrow — and the government now carries their mandate for sweeping change."

 ENG_r56rp_council_housing_initiative:0 "Council Housing Initiative"
 ENG_r56rp_council_housing_initiative_desc:0 "Britain’s slums are a national shame. Labour moves to provide vast numbers of affordable council homes, uplifting millions and reshaping the urban landscape."

 ENG_r56rp_industrial_modernization_act:0 "Industrial Modernization Act"
 ENG_r56rp_industrial_modernization_act_desc:0 "A bold overhaul of outdated industrial infrastructure, this act prioritizes efficiency, innovation, and worker welfare — ensuring that Britain remains competitive in the rapidly changing global economy."

 ENG_r56rp_reform_the_establishment:0 "Reform the Establishment"
 ENG_r56rp_reform_the_establishment_desc:0 "The old political elite bristles at Labour’s rise. By reforming the entrenched establishment, Labour seeks to dismantle long-standing barriers to progress and democracy."

 ENG_r56rp_strengthen_the_trade_unions:0 "Strengthen the Trade Unions"
 ENG_r56rp_strengthen_the_trade_unions_desc:0 "Unions have always been Labour’s backbone. Empowering them strengthens workers’ rights and ensures a direct voice for labourers in national policy."

 ENG_r56rp_labour_ascendent:0 "Labour Ascendant"
 ENG_r56rp_labour_ascendent_desc:0 "Labour’s influence reaches an unprecedented peak. Britain stands on the brink of transformational class reform, and the old order grows uneasy as workers claim their rightful place."

 ### HARDLINERS VS MODERATES ###
 ENG_r56rp_hardliners_join_the_cabinet:0 "Hardliners Join the Cabinet"
 ENG_r56rp_hardliners_join_the_cabinet_desc:0 "Left-wing hardliners force their way into government positions, pushing radical reforms and alarming moderates. Britain braces for ideological turbulence."

 ENG_r56rp_hardliners_outsted:0 "Hardliners Ousted"
 ENG_r56rp_hardliners_outsted_desc:0 "The party leadership steps decisively to remove disruptive elements. The cabinet is stabilised under a more pragmatic, disciplined vision for Labour’s future."

 ENG_r56rp_restablish_party_unity:0 "Reestablish Party Unity"
 ENG_r56rp_restablish_party_unity_desc:0 "With internal disputes cooling, Labour begins the difficult work of knitting together its fractured factions. Only a unified party can govern effectively."

 ENG_r56rp_enforce_democratic_socialist_principles:0 "Enforce Democratic Socialist Principles"
 ENG_r56rp_enforce_democratic_socialist_principles_desc:0 "Labour doubles down on its ideological core, pushing forward policies rooted in democratic socialism and reaffirming its foundational values."

 ENG_r56rp_a_new_socialist_dawn:0 "A New Socialist Dawn"
 ENG_r56rp_a_new_socialist_dawn_desc:0 "Britain awakens into a new era. Guided by democratic socialism, reform spreads across the nation — promising prosperity, equality, and collective strength."

 ### REBUILDING BRITAIN ###
 ENG_r56rp_rebuild_the_working_towns:0 "Rebuild the Working Towns"
 ENG_r56rp_rebuild_the_working_towns_desc:0 "Northern and industrial towns — once engines of empire — have grown worn and weary. Labour invests heavily to restore their dignity and vitality."

 ENG_r56rp_improve_northern_industries:0 "Improve Northern Industries"
 ENG_r56rp_improve_northern_industries_desc:0 "Long neglected by London elites, Northern industry receives new funding and infrastructure, unlocking Britain’s vast untapped potential."

 ENG_r56rp_expand_midlands_industries:0 "Expand Midlands Industries"
 ENG_r56rp_expand_midlands_industries_desc:0 "The Midlands’ factories roar back to life as Labour establishes new industrial zones dedicated to modern production."

 ENG_r56rp_revitalize_the_union_industries:0 "Revitalize the Union Industries"
 ENG_r56rp_revitalize_the_union_industries_desc:0 "Across Scotland, Wales, and Northern Ireland, Labour revitalizes industries suffering from decades of mismanagement, ensuring opportunity reaches every corner of the Isles."

 ENG_r56rp_education_without_barriers:0 "Education Without Barriers"
 ENG_r56rp_education_without_barriers_desc:0 "Education becomes a right, not a privilege. Labour expands schools, improves standards, and ensures that no British child is left behind."

 ### MONARCHY & COMMONWEALTH ###
 ENG_r56rp_crown_and_commonwealth_reform:0 "Crown and Commonwealth Reform"
 ENG_r56rp_crown_and_commonwealth_reform_desc:0 "A sweeping review of imperial administration aims to create a fairer, more cooperative Commonwealth free of outdated aristocratic control."

 ENG_r56rp_a_modern_monarchy:0 "A Modern Monarchy"
 ENG_r56rp_a_modern_monarchy_desc:0 "With royal approval, Labour modernizes the monarchy — transforming it into a more symbolic, democratic institution suited for a new age."

 ENG_r56rp_a_stand_against_communism:0 "A Stand Against Communism"
 ENG_r56rp_a_stand_against_communism_desc:0 "Though committed to social justice, Labour rejects outright communist revolution. Britain must stand firm against authoritarian Marxist influence at home and abroad."

 ENG_r56rp_responsible_rearnment:0 "Responsible Rearmament"
 ENG_r56rp_responsible_rearnment_desc:0 "Europe darkens. Labour initiates a cautious but necessary rearmament program, ensuring Britain can defend itself without descending into militarism."

 ENG_r56rp_a_new_britian:0 "A New Britain"
 ENG_r56rp_a_new_britian_desc:0 "Out of reform, unity, and purpose, Labour forges a new Britain: modern, confident, and ready to face the challenges of the coming era."

 ### ECONOMIC PATHS — CITY VS COUNTRYSIDE ###
 ENG_r56rp_socialism_in_the_city:0 "Socialism in the City"
 ENG_r56rp_socialism_in_the_city_desc:0 "Urban Britain becomes the testing ground for modern socialist economics — cooperative ventures, state programmes, and worker representation flourish."

 ENG_r56rp_capitalism_in_the_countryside:0 "Capitalism in the Countryside"
 ENG_r56rp_capitalism_in_the_countryside_desc:0 "In rural regions, Labour experiments with a controlled, market-friendly model — balancing economic freedom with social protection."

 ENG_r56rp_trade_union_economics:0 "Trade Union Economics"
 ENG_r56rp_trade_union_economics_desc:0 "Labour leans into union-driven frameworks that place workers at the heart of national economic planning."

 ENG_r56rp_equal_pay_for_workers:0 "Equal Pay for Workers"
 ENG_r56rp_equal_pay_for_workers_desc:0 "Wage inequality is abolished. Employers must pay fairly and universally, closing the gaps that have divided Britain’s labour market."

 ENG_r56rp_nep_success:0 "NEP Success"
 ENG_r56rp_nep_success_desc:0 "A hybrid economic model — Labour's own New Economic Plan — proves successful. Both rural markets and urban industries thrive under careful guidance."

 ### COOPERATIVE ECONOMICS ###
 ENG_r56rp_cooperative_capitalism:0 "Cooperative Capitalism"
 ENG_r56rp_cooperative_capitalism_desc:0 "Labour pioneers a bold middle path: an economy where private enterprise and worker cooperatives coexist under fair, regulated principles."

 ENG_r56rp_state_control_of_coal_and_steel:0 "State Control of Coal and Steel"
 ENG_r56rp_state_control_of_coal_and_steel_desc:0 "Critical industries are placed under government oversight, ensuring strategic resources remain in the hands of the nation — not profiteers."

 ENG_r56rp_expand_the_mining_boards:0 "Expand the Mining Boards"
 ENG_r56rp_expand_the_mining_boards_desc:0 "Mining oversight boards gain new power to coordinate production, improve conditions, and stabilize Britain’s energy supply."

 ENG_r56rp_national_motor_works:0 "National Motor Works"
 ENG_r56rp_national_motor_works_desc:0 "A state-affiliated motor manufacturer is established, pushing forward innovation in automobiles, trucks, and military vehicles."

 ENG_r56rp_unified_economic_plan:0 "Unified Economic Plan"
 ENG_r56rp_unified_economic_plan_desc:0 "Britain's disparate economic experiments are consolidated into a single national program, providing coherence and direction for long-term growth."

 ### SOCIAL PROGRAMS ###
 ENG_r56rp_establish_the_nhs:0 "Establish the NHS"
 ENG_r56rp_establish_the_nhs_desc:0 "A dream becomes reality: a national health service providing free, universal care. Britain becomes healthier, stronger, and more compassionate."

 ### HARDLINER SOCIALIST PATH ###
 ENG_r56rp_new_politcal_thought:0 "New Political Thought"
 ENG_r56rp_new_politcal_thought_desc:0 "Radical thinkers inspire the party with bold visions of a restructured society, challenging even Labour’s established ideological boundaries."

 ENG_r56rp_invite_soviet_advisors:0 "Invite Soviet Advisors"
 ENG_r56rp_invite_soviet_advisors_desc:0 "Labour opens its doors to Soviet planners and economists, seeking to draw upon their expertise — or their influence."

 ENG_r56rp_red_renewal_of_britain:0 "Red Renewal of Britain"
 ENG_r56rp_red_renewal_of_britain_desc:0 "Soviet guidance and Labour zeal reshape Britain into a nation with unmistakably socialist character — red banners and all."

 ENG_r56rp_red_leagues_of_britian:0 "Red Leagues of Britain"
 ENG_r56rp_red_leagues_of_britian_desc:0 "Socialist leagues unite under a common banner, mobilizing workers to defend and advance the revolution within Britain."

 ENG_r56rp_workers_militia_congress:0 "Workers' Militia Congress"
 ENG_r56rp_workers_militia_congress_desc:0 "Worker militias convene to formalize their role in national security, forming a parallel defensive force loyal to socialist principles."

 ENG_r56rp_fair_deal_for_veterans:0 "Fair Deal for Veterans"
 ENG_r56rp_fair_deal_for_veterans_desc:0 "Veterans of past conflicts receive recognition, housing, and employment — proving that socialism does not forget those who served."

 ENG_r56rp_reform_the_old_guard:0 "Reform the Old Guard"
 ENG_r56rp_reform_the_old_guard_desc:0 "The entrenched officers of the old military elite face sweeping reform, bringing Britain’s armed forces into alignment with the new ideology."

 ### CIVIL SERVICE & POLITICAL REFORM ###
 ENG_r56rp_reshape_the_civil_service:0 "Reshape the Civil Service"
 ENG_r56rp_reshape_the_civil_service_desc:0 "The civil service — long dominated by aristocrats and Oxbridge elitism — is transformed into a fair, meritocratic institution."

 ENG_r56rp_strengthen_parliamentry_socialism:0 "Strengthen Parliamentary Socialism"
 ENG_r56rp_strengthen_parliamentry_socialism_desc:0 "Labour reaffirms its commitment to achieving socialism through democratic means, reinforcing Parliament as the heart of reform."

 ENG_r56rp_abolish_hereditary_privilege:0 "Abolish Hereditary Privilege"
 ENG_r56rp_abolish_hereditary_privilege_desc:0 "The last remnants of Britain’s feudal past — aristocratic privilege, inherited authority, and peerage immunity — are swept away."

 ENG_r56rp_the_peoples_consitution:0 "The People's Constitution"
 ENG_r56rp_the_peoples_consitution_desc:0 "Britain adopts a new constitution designed by and for the people — a foundational document to reshape society."

 ### FINAL PATHS ###
 ENG_r56rp_united_socialist_isles:0 "United Socialist Isles"
 ENG_r56rp_united_socialist_isles_desc:0 "England, Scotland, Wales, and Ireland unite under a democratic socialist federation — a new collective identity for the Isles."

 ENG_r56rp_britians_second_revolution:0 "Britain's Second Revolution"
 ENG_r56rp_britians_second_revolution_desc:0 "A political upheaval shakes the nation as Labour pushes beyond democratic socialism into a full-scale revolution, remaking Britain entirely."


## english bop emergancy election

 ### --- BO P NAME --- ###
 ENG_emergency_election_bop:0 "Emergency Election Power Struggle"

 ### --- SIDES --- ###
 ENG_labour_side:0 "Labour Influence"
 ENG_conservative_side:0 "Conservative Influence"

 ### --- SIDE DESCRIPTIONS --- ###
 ENG_labour_side_desc:0 "The Labour Party pushes Britain toward sweeping reforms, state-led recovery, and a promise to rebuild a battered nation with the power of working people at the helm."
 ENG_conservative_side_desc:0 "The Conservative Party stands firm on order, stability, and traditional authority, rallying Britain behind experienced leadership during a time of national crisis."

 ### --- NEUTRAL ZONE --- ###
 ENG_neutral_balance:0 "Hung Parliament"
 ENG_neutral_balance_desc:0 "Neither Labour nor the Conservatives hold a decisive advantage. Britain enters a tense deadlock, where every speech, scandal or policy shift can swing the election."

 ### --- LABOUR RANGES --- ###
 ENG_low_labour_influence:0 "Growing Labour Momentum"
 ENG_low_labour_influence_desc:0 "Labour begins to creep ahead—trade unions rally, the press warms, and the political tide hints that the working-class agenda is becoming mainstream."

 ENG_medium_labour_influence:0 "Labour Resurgence"
 ENG_medium_labour_influence_desc:0 "Labour’s vision captivates the public. Party organisers sweep the streets, reforms are demanded, and the Conservatives struggle to regain control of the narrative."

 ENG_high_labour_influence:0 "Labour Dominance"
 ENG_high_labour_influence_desc:0 "The Labour Party stands on the brink of securing a historic victory. Policies once considered bold now define the national conversation. Britain braces for transformation."

 ENG_total_labour_influence:0 "Labour Ascendancy"
 ENG_total_labour_influence_desc:0 "The Labour Party commands overwhelming support. The Conservatives fracture as Britain prepares for a new era shaped entirely by labour reform, unity, and people-driven governance."

 ### --- CONSERVATIVE RANGES --- ###
 ENG_low_conservative_influence:0 "Rising Conservative Strength"
 ENG_low_conservative_influence_desc:0 "The Conservatives begin to regroup. Business leaders, the press, and establishment figures align behind a return to order as Labour loses momentum."

 ENG_medium_conservative_influence:0 "Conservative Revival"
 ENG_medium_conservative_influence_desc:0 "A renewed Conservative movement gains traction. Their message of stability and experience cuts through uncertainty, winning over moderates and elites alike."

 ENG_high_conservative_influence:0 "Conservative Control"
 ENG_high_conservative_influence_desc:0 "The Conservatives dominate political discourse. Their grip tightens across Parliament, lobby networks, and institutions. Labour struggles to maintain relevance."

 ENG_total_conservative_influence:0 "Conservative Supremacy"
 ENG_total_conservative_influence_desc:0 "The Conservatives secure absolute dominance. Britain prepares for a firm, disciplined government that promises continuity and strength in an uncertain world."

 ### --- DECISION CATEGORY --- ###
 ENG_emergency_election_bop_category:0 "Balance of Power — Emergency Election"
 ENG_emergency_election_bop_category_desc:0 "The United Kingdom is in the midst of a constitutional storm. With the government collapsing, a snap election pits Labour and the Conservatives against each other in a ruthless contest to seize control of Britain’s future. Every decision, every scandal, and every policy has the potential to tip the scales."

