  #CHARACTERS
  ENG_elizabeth_ii:0 "Elizabeth II"
  ENG_charles_edward_of_albany:0 "Charles Edward of Albany"
  ENG_r56_percy_hobart:0 "Percy Hobart"
  ENG_anthony_eden: "Anthony Eden"
 
  ENG_william_birdwood:0 "William Birdwood"
 #Focus Shortcuts
  ENG_communism_sc:0 "Politics: Communism"
  ENG_fascism_sc:0 "Politics: Fascism"
  ENG_king_sc:0 "Politics: Monarchy"
  ENG_democracy_sc:0 "Politics: Democracy"
  ENG_decolonize_sc:0 "Colonies: Decolonization"
  ENG_colonial_affairs_sc:0 "Colonies: Imperialism"
