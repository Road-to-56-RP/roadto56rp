### Events
	# Election
		SWE_r56rp_election.1.t: "The Upcoming Election"
		SWE_r56rp_election.1.d: "With yet another election looming on the horizon, people have been wondering as to whom is going to come out on top in this election. §RPer-Albin Hansson§! and his §RFolkhemmet§! has proven to be quite popular among the workers of our cities as his party seems to have moved away from the borderline Marxist ideology they held only sixteen years ago.\n\nBut not everyone is ready to throw their vote into his basket, and §BGösta Bagge§! seems to be the name most people seem interested in seeing taking the charge with his more §BConservative§! views along with his party, though both sides have vowed to maintain the Neutrality that kept us safe through the Great War."
		SWE_r56rp_election.1.a: "Per-Albin Hansson hasn't led us astray yet, one more term!"
		SWE_r56rp_election.1.b: "Gösta Bagge holds the key to a prosperous, and safe, Sweden!"

	# Budget
		SWE_r56rp_budget.1.t: "The Question of the Defense Budget"
		SWE_r56rp_budget.1.d: "Four years ago, the current defense budget was put into place, it is now time take a look at it once more. With tensions brewing across Europe there are those who think we should move away from disarmament and ensure that our defenses and military is prepared for yet another war in Europe.\n\nWith what the way we have been going, our economy isn't quite ready for a potential war, not quite yet at least, so, the question remains\n\nWhat should we do?"
		SWE_r56rp_budget.1.a: "We should make some adjustments, but maintain a similar scope for now"
		SWE_r56rp_budget.1.b: "A temporary amendment for one year should help put us in a favourable position"