  # Events
    ITA_r56rp_romania.1.t: "[ITA.GetNameDefCap] Proposes Further Cooperation"
    ITA_r56rp_romania.1.d: "With our increased collaboration with the Italians, ambassadors from Rome have proposed that we take our cooperation a step further by showing the world that we harbor no ill will towards one another and in fact are working together to strengthen the relations between our two countries. Although not quite necessary, the Italian Ambassadors have proposed a mutual Non-Aggression Pact to signify the first step towards an alliance between our two nations, how shall we proceed?"
    ITA_r56rp_romania.1.a: "Very well, we see no harm in this"
    ITA_r56rp_romania.1.b: "We can not tie ourselves to the Italians"
    ITA_r56rp_romania.2.t: "[FROM.GetNameDefCap] and [ITA.GetNameDefCap] Presents an Ultimatum"
    ITA_r56rp_romania.2.d: "Ever since [FROM.GetNameDef] and [ITA.GetNameDef] began to work more closely together, we could see the writing on the wall when it came to reclaiming our historical lands within Romania. Now, ambassadors from both nations have come to us with an ultimatum, subject ourselves to rule from Romania or face invasion, our options seem quite limited, but we can always fight.\n\nWhat shall we do?"
    ITA_r56rp_romania.2.a: "There is no use, we'll submit, for now"
    ITA_r56rp_romania.2.b: "We shall take every inch of Bulgarian land from Romania!"
    ITA_r56rp_romania.3.t: "[FROM.GetNameDefCap] Submits to us"
    ITA_r56rp_romania.3.d: "Today our ambassador returned to Bucharest with great news, [FROM.GetNameDef] has seen reason and has chosen the path of least resistance for them and submitted themselves to be ruled from Bucharest instead."
    ITA_r56rp_romania.3.a: "Wonderful news!"
    ITA_r56rp_romania.4.t: "[FROM.GetNameDefCap] Stands Defiant"
    ITA_r56rp_romania.4.d: "In a not too surprising move [FROM.GetNameDef] has announced to the world that they will fight for every inch of Bulgarian lands, even going so far as to announce that they will reclaim lands lost over a hundred years ago"
    ITA_r56rp_romania.4.a: "Lunatics, all of them"