    ITA_r56rp_compliance_north_africa: "Compliance in all §YTunisian§! and §YEgyptian States§! excluding §YSinai§! is at or above §Y40%§!"
  # Focuses
    ITA_r56rp_renew_the_pact_of_1926: "Renew the Pact of 1926"
    ITA_r56rp_renew_the_pact_of_1926_desc: "In §YSeptember 1926§!, we signed a Pact of Friendship and Collaboration with the §YKingdom of Romania§!. It was maintained until §YSeptember of 1934§!, before it was allowed to run out. Now, we should look to renew the pact once more and strengthen relations with the Romanians again so that we may weather the coming storm together"
    ITA_r56rp_cultivate_romanian_support: "Cultivate Romanian Support"
    ITA_r56rp_cultivate_romanian_support_desc: "As a sign of Friendship and further support we should offer a pact of non-aggression, to signal to the rest of the Balkans that Italy and Romania are still friends after all this time."
    ITA_r56rp_anchor_latin_influence_in_the_balkans: "Anchor Latin Influence in the Balkans"
    ITA_r56rp_anchor_latin_influence_in_the_balkans_desc: "With our initial diplomatic approach towards the Romanians, we can now take it one step further by taking on joint exercises and strengthen both our nations, as well as ensure that Latin influence remains rooted within the Balkans"

