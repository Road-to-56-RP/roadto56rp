 FRA_r56rp_established_feaa: "Has established the §YFrench East Asian Administration§!"

 # Tooltips
 FRA_r56rp_form_an_feaa_expeditionary_task_force_tt: "A §YTask Force§! consisting of 1 §YHeavy Cruiser§!, 2 §YLight Cruisers§! and 5 §YDestroyers§! will be handed over to the §YFrench East Asian Administration§! to aid them"

 # R56RP Decisions
 FRA_national_defence_plan_cat: "National Defence Plan"
 FRA_national_defence_plan_cat_desc: "Victory in the Great War has lulled much of our military into a dangerous sense of security. Yet the world grows darker by the day, and France must not face the next conflict unprepared."
 FRA_expand_aircraft_procurement: "Expand Aircraft Procurement"
 FRA_expand_aircraft_procurement_desc: "The CSG has concluded that our stock of modern aircraft is far too small to meet the demands of the next war. By accelerating the procurement programs outlined in Plans I–III, we can finally begin rebuilding a capable and modern air fleet."
 FRA_execute_the_dyle_plan: "Execute the Dyle Plan"
 FRA_execute_the_dyle_plan_desc: "To shield northern France and protect Belgium, the CSG has approved the Dyle Plan. Our forces will advance to the Dyle River line at the outbreak of war, establishing a forward defense to contain any German offensive."
 FRA_expand_the_armed_forces: "Expand the Armée de Terre"
 FRA_the_dyle_mission: "The Dyle Mission"
 FRA_r56rp_colonial_management_cat: "Colonial Management"
 FRA_r56rp_colonial_management_cat_desc: "Our Colonial Empire is one of the largest in the world, and therefore, it requires a bit more management than one could expect. From here, we can redraw some of the earlier treaties that were signed a few years ago as well as set up new and manage new treaties.\n"
 FRA_r56rp_rewrite_tunisian_protectorate_treaty: "Rewrite the §YTunisian§! Protectorate Treaty"
 FRA_r56rp_rewrite_moroccan_protectorate_treaty: "Rewrite the §YMoroccan§! Protectorate Treaty"
 FRA_r56rp_form_the_feaa: "Form the §YFrench East Asian Administration§!"
 FRA_r56rp_expand_the_administrative_zone_west: "Expand the Administrative Zone West"
 FRA_r56rp_expand_the_administrative_zone_south: "Expand the Administrative Zone South"
 FRA_r56rp_form_an_feaa_expeditionary_task_force: "Form an §YFrench East Asian Administrative§! Expeditionary Task Force"

