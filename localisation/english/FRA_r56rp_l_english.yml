 # Focuses
 FRA_armee_de_terre: "Armée de Terre"
 FRA_armee_de_terre_desc: ""
 FRA_kickstart_the_arms_industry: "Kickstart the Arms Industry"
 FRA_kickstart_the_arms_industry_desc: "The early rearmament programs Plans I through III,revealed how far our armaments sector has fallen behind. By injecting funds, reorganizing industry, and accelerating state oversight, we can finally kickstart large-scale weapons production and meet the demands of modern war."
 FRA_la_bataille_methodique: "La Battaile Methodique"
 FRA_la_bataille_methodique_desc: "We remain committed to the doctrine where firepower, fixed schedules, and centralized control dictate the tempo of battle though slow and inflexible, this method offers predictability if not adaptability in the conflicts to come."
 FRA_supressive_barrage: "Suppresive Barrage"
 FRA_supressive_barrage_desc: "With our modernization and planning complete our army can now employ sustained suppressive fire to pin down enemy formations, disrupt their movements, and create openings for decisive assaults."
 FRA_chasseurs_de_chars: "Chasseurs de Chars"
 FRA_chasseurs_de_chars_desc: "To counter the armored threat posed by our rivals, specialized tank-destroyer formations must be developed. Fast, well-armed, and designed to eliminate enemy armor, these vehicles will provide an agile and lethal anti-tank spearhead."
 FRA_doctrinal_modernization: "Doctrinal Modernization"
 FRA_doctrinal_modernization_desc: "With the structure of our armored forces now established and our plans set in motion, we can finally face our enemies with confidence. Not only relying on the strength of the Maginot and the men manning it to protect us."
 FRA_legere_mecanique: "Legere Mecanique"
 FRA_legere_mecanique_desc: "We have been relying on cavalry far too long, our armoured forces must be supported by armoured vehicles. Many of our national companies have already come foward with designs for said vehicles."
 FRA_chasseur_alpine: "Chasseur Alpine"
 FRA_chasseur_alpine_desc: "Alpine warfare demands troops capable of swift movement, precision, and unmatched stamina. By expanding our formations, our elite units will be able to exploit the natural defenses of our highlands and seize the tactical advantage in rugged terrain."
 FRA_frontline_hospitals: "Frontline Hospitals"
 FRA_frontline_hospitals_desc: "The Great War taught us a painful lesson, countless brave soldiers were lost not only to enemy fire, but to infection, exposure, and disease. By investing in modern frontline medical units, we can ensure that the next war, if it comes will not claim so many lives needlessly"
 FRA_end_the_interservice_rivalry: "End the Interservice Rivalry"
 FRA_end_the_interservice_rivalry_desc: ""
 FRA_strengthen_northern: "Strengthen Northern Industry"
 FRA_strengthen_northern_desc: ""
 FRA_strengthen_southern: "Strengthen Southern Industry"
 FRA_strengthen_southern_desc: ""
 FRA_empower_the_national_economic_council: "Empower the National Economic Council"
 FRA_empower_the_national_economic_council_desc: "Although the National Economic Council was established back in 1925, it has long been underused and politically sidelined. By revitalizing the Council and expanding its authority, we can restore it as a central forum where unions, employers, and government experts coordinate our response to the economic crisis."
 FRA_nationalize_gas_and_electricity_sector: "Nationalize Gas and Electricity Sector"
 FRA_nationalize_gas_and_electricity_sector_desc: ""
 FRA_ride_it_out: "Ride It Out"
 FRA_ride_it_out_desc: "Devaluation may promise quick relief, but it also brings chaos, inflation, and the ruin of millions who trust the stability of the franc. Our nation will hold firm!"
 FRA_renault_factories: "Renault Factories"
 FRA_renault_factories_desc: "With the looming of a conflict, Renault has proposed investing in the southern french states by moving their production lines further away from the battlefields."
 FRA_expand_the_calais_mining_basin: "Expand the Calais Basin"
 FRA_expand_the_calais_mining_basin_desc: "The Calais basin remains the industrial heart of France, producing the majority of our coal. By modernizing its mines, expanding extraction shafts, and improving railway access, we can significantly increase national energy output and reduce dependence on imported fuels."
 FRA_bilateral_trade_agreements: "Bilateral Trade Agreements"
 FRA_bilateral_trade_agreements_desc: "With global trade still weakened by the Depression, We must secure reliable markets through negotiated agreements. Strengthening our commercial ties with friendly nations will stabilize exports, ensure access to materials, and reinforce our position in Europe."
 FRA_modernization_of_the_battlefleet: "Modernization of the Battlefleet"
 FRA_modernization_of_the_battlefleet_desc: "Although we have fully embraced the Jeune École, our navy still relies heavily on large, aging capital ships. At this pace, our fleet will become obsolete within a few years. We must modernize our battlefleet to reflect our new doctrine, prioritizing speed, flexibility, and modern technology over sheer size."
