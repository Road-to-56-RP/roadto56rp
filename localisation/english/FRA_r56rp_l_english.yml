 FRA_maintain_the_union: "Maintain the Union"
 FRA_maintain_the_union_desc: "The Indochinese Union is the jewel of our overseas empire. Its unity under French authority is essential to stability, prosperity, and the preservation of our influence in the Far East. We cannot allow this structure to be dismantled."
 FRA_reinforce_indigenous_authorities: "Reinforce Indigenous Authorities"
 FRA_reinforce_indigenous_authorities_desc: "Across our overseas possessions, a loyal colonial elite has emerged,  administrators, officers, and notables whose interests are inseparable from those of France."
 FRA_allies_not_subjects: "Allies not Subjects"
 FRA_citizenship_through_service: "Citizenship Through Service"
 FRA_citizenship_through_service_desc: "The French Republic has always rewarded loyalty. Those among our colonial subjects who serve France whether in uniform, administration, or industry will be granted full citizenship and protected by all laws of men."
