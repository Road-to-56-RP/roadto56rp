l_english:
 # R56RP Dynamic Modifier
 FRA_r56rp_marine_national:0 "La Marina National"
 FRA_r56rp_marine_national_desc:0 "Through innovation and unified doctrine, we reclaim command of the seas. Our cruisers will strike the distant lanes, our submarines the depths, and the Marine Nationale shall guard France’s destiny\n\nToujours en Avant."
 FRA_r56rp_marine_national_dynamic_modifier_tt:0 "Modify §Y$FRA_r56rp_marine_national$§! by"
 FRA_r56rp_armee_de_lair:0 "Armée de l'air"
 FRA_r56rp_armee_de_lair_desc:0 "Still developing its identity as an independent force, the Armée de l’Air faces the growing reality that much of its equipment is falling behind. To safeguard France, we must modernize quickly and restore our edge in the skies.\n\n"
 FRA_r56rp_armee_de_lair_tt:0 "Modify §Y$FRA_r56rp_armee_de_lair$§! by"
 FRA_r56rp_armee_de_terra:0 "Armée de terre"
 FRA_r56rp_armee_de_terra_desc:0 ""
 FRA_r56rp_armee_de_terra_tt:0 "Modify §Y$FRA_r56rp_armee_de_terra$§! by"


 # R56RP Decisions
 FRA_national_defence_plan_cat:0 "National Defence Plan"
 FRA_national_defence_plan_cat_desc:0 "Victory in the Great War has lulled much of our military into a dangerous sense of security. Yet the world grows darker by the day, and France must not face the next conflict unprepared."
 FRA_expand_aircraft_procurement:0 "Expand Aircraft Procurement"
 FRA_expand_aircraft_procurement_desc:0 "The CSG has concluded that our stock of modern aircraft is far too small to meet the demands of the next war. By accelerating the procurement programs outlined in Plans I–III, we can finally begin rebuilding a capable and modern air fleet."
 FRA_execute_the_dyle_plan:0 "Execute the Dyle Plan"
 FRA_execute_the_dyle_plan_desc:0 "To shield northern France and protect Belgium, the CSG has approved the Dyle Plan. Our forces will advance to the Dyle River line at the outbreak of war, establishing a forward defense to contain any German offensive."

 # Custom Triggers - R56RP
 FRA_strenghten_aircraft_small_procurement_tt:0 "Has produced or acquired §Y[?ROOT.FRA_fighters_to_produce]§! new §Y$fighter_equipment$§! aircraft. \nCurrent Fighters §YDeployed§! or in §YStockpile§!: §G[?ROOT.num_deployed_planes_with_type@small_plane_airframe]§!\n"

 FRA_strenghten_aircraft_large_procurement_tt:0 "Has produced or acquired §Y[?ROOT.FRA_bombers_to_produce]§! new §Y$tac_bomber_equipment$§! aircraft. \nCurrent Bombers §YDeployed§! or in §YStockpile§!: §G[?ROOT.num_deployed_planes_with_type@medium_plane_airframe]§!\n"

 FRA_strenghten_cas_procurement_tt:0 "Has produced or acquired §Y[?ROOT.FRA_CAS_to_produce]§! new §Y$CAS_equipment$§! aircraft. \nCurrent Close Air Support §YDeployed§! or in §YStockpile§!: §G[?ROOT.num_deployed_planes_with_type@small_plane_cas_airframe]§!"


 # Focuses
 FRA_kickstart_the_arms_industry:0 "Kickstart the Arms Industry"
 FRA_kickstart_the_arms_industry_desc:0 "The early rearmament programs Plans I through III,revealed how far our armaments sector has fallen behind. By injecting funds, reorganizing industry, and accelerating state oversight, we can finally kickstart large-scale weapons production and meet the demands of modern war."