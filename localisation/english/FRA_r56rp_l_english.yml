 FRA_r56rp_marine_national:0 "La Marina National"
 FRA_r56rp_marine_national_desc:0 "Through innovation and unified doctrine, we reclaim command of the seas. Our cruisers will strike the distant lanes, our submarines the depths, and the Marine Nationale shall guard France’s destiny\n\nToujours en Avant."
