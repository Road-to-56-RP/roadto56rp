 # R56RP Dynamic Modifier
 FRA_r56rp_marine_national: "La Marina National"
 FRA_r56rp_marine_national_desc: "Through innovation and unified doctrine, we reclaim command of the seas. Our cruisers will strike the distant lanes, our submarines the depths, and the Marine Nationale shall guard France’s destiny\n\nToujours en Avant."
 FRA_r56rp_marine_national_dynamic_modifier_tt:0 "Modify §Y$FRA_r56rp_marine_national$§! by"
 FRA_r56rp_armee_de_lair: "Armée de l'Air"
 FRA_r56rp_armee_de_lair_desc: "Still developing its identity as an independent force, the Armée de l’Air faces the growing reality that much of its equipment is falling behind. To safeguard France, we must modernize quickly and restore our edge in the skies.\n\n"
 FRA_r56rp_armee_de_lair_tt: "Modify §Y$FRA_r56rp_armee_de_lair$§! by"
 FRA_r56rp_armee_de_terra: "Armée de Terre"
 FRA_r56rp_armee_de_terra_desc: ""
 FRA_r56rp_armee_de_terra_tt: "Modify §Y$FRA_r56rp_armee_de_terra$§! by"
 FRA_r56rp_economic_status_modifier: "L'économie Française"
 FRA_r56rp_economic_status_tt: "Modify §Y$FRA_r56rp_economic_status_modifier$§! by"

