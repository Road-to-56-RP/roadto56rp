 FRA_r56rp_formalize_the_CAE: "Formalize the CAE"
 FRA_r56rp_formalize_the_CAE_desc: ""
 FRA_r56rp_tackle_deflation: "Tackle Deflation"
 FRA_r56rp_tackle_deflation_desc: "" 
 FRA_r56rp_guaranteed_contracts: "Guaranteed Contracts"
 FRA_r56rp_guaranteed_contracts_desc: "Many within our arms industry worry that our nationalization plans will limit contracts for private investors, to ensure their support we must ensure contracts are guaranteed." # Need better loc my brain is smoothing out
 FRA_r56rp_bank_of_france_reform: "Bank of France Reform"
 FRA_r56rp_bank_of_france_reform_desc: ""
 FRA_r56rp_agriculture_national_office: "Agricultural National Office"
 FRA_r56rp_agriculture_national_office_desc: ""
 FRA_r56rp_housing_development: "Housing Development"
 FRA_r56rp_housing_development_desc: ""
