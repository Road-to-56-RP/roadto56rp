 FRA_r56rp_begin_armament_sector_nationalization_desc: ""
 FRA_r56rp_nationalization_efforts_desc: ""
 FRA_r56rp_agricultural_investments: "Agricultural Investments"
 FRA_r56rp_agricultural_investments_desc: ""
 FRA_r56rp_price_controls: "Price Controls"
 FRA_r56rp_price_controls_desc: ""
 FRA_r56rp_a_planned_economy: "A Planned Economy"
 FRA_r56rp_a_planned_economy_desc: ""
 FRA_r56rp_expand_state_arsenals: "Expand State Arsenals"
 FRA_r56rp_expand_state_arsenals_desc: ""
 FRA_r56rp_fund_scs: "Fund SCS"
 FRA_r56rp_fund_scs_desc: ""
 FRA_r56rp_national_defence_plan: "National Defence Plan"
 FRA_r56rp_national_defence_plan_desc: "With a resurgent [GER.GetName] and [ITA.GetName], it is clear that conflict may soon be unavoidable. We must strengthen our defenses, reorganize our forces, and prepare the nation for the trials that lie ahead."
 FRA_r56rp_giraud_plan: "Giraud Plan"
 FRA_r56rp_giraud_plan_desc: "In times like these, it is best to strengthen our defenses. If there are threats, let them come to us so that we can deal with them on our land. We have a perfect candidate to lead our army; all we need is the word to do so."
 FRA_r56rp_the_queen_of_battle: "The Queen of Battle"
 FRA_r56rp_the_queen_of_battle_desc: "Infantry has always been the backbone of our army, and with modern doctrines and advancments in their equipment, we are now fully able to defend our Marianne."
 FRA_r56rp_fortification_focus: "Alpine Forts"
 FRA_r56rp_fortification_focus_desc: "The [ITA.GetAdjective]s won't cross the border so quickly once we finish covering the Alps with our newly planned line of defense. We will have time to respond and reinforce our position."
 FRA_r56rp_commission_fortified_regions: "CORF Mission"
 FRA_r56rp_commission_fortified_regions_desc: "We can recreate the old Commission for Organizing the Fortified Regions of 1927 to study our actual border fortifications and update our defense plans."
 FRA_r56rp_strenghten_anti_tank_capabilities: "Strengthen Anti Tank Capabilities"
 FRA_r56rp_strenghten_anti_tank_capabilities_desc: "Our guns can no longer keep pace with rising armor thickness. By prioritizing improved anti-tank artillery, we will ensure our tanks and our infantry can stop any armored threat head-on."
 FRA_r56rp_modernize_infantry_equipment: "Modernize Infantry Equipment"
 FRA_r56rp_modernize_infantry_equipment_desc: "Our soldiers deserve dependable, modern equipment. Investing in new rifles, machine guns, and infantry training will strengthen the backbone of our army."
 FRA_r56rp_extend_the_maginot_line: "Extend the Maginot Line"
 FRA_r56rp_extend_the_maginot_line_desc: "We cannot count on [BEL.GetNameDef] to hold their ground; if they let enemy armies through, we might be in trouble. Extending the Maginot Line is crucial to keeping unwanted troops out of [FRA.GetNameDef]!"
 FRA_r56rp_partial_mobilization: "Partial Mobilization"
 FRA_r56rp_partial_mobilization_desc: ""
 FRA_r56rp_de_gaulle_strategy: "De Gaulle Strategy"
 FRA_r56rp_de_gaulle_strategy_desc: "We cannot sit idly by as enemies move in on our borders. And we cannot leave our allies to fend for themselves in a war scenario. Prepare our army! Gamelin is the man for the job."
 FRA_r56rp_la_guerra_mecanique: "La Guerre Mécanique"
 FRA_r56rp_la_guerra_mecanique_desc: "The future of warfare will be shaped by speed, steel, and mobility. By embracing fully mechanized formations and modern armored doctrine, we will be ready for the next great war."
 FRA_r56rp_chars_de_bataille: "Chars de Bataille"
 FRA_r56rp_chars_de_bataille_desc: ""
 FRA_r56rp_chars_de_infanterie: "Chars d’Appui d’Infanterie"
 FRA_r56rp_chars_de_infanterie_desc: "Whatever else, the first and foremost duty of tanks is to enable infantry to take and hold ground. Therefore, we must always ensure our infantry units are supported by modern, adequately armed and most capable tanks."
 FRA_r56rp_mechanized_focus: "Mechanized Focus"
 FRA_r56rp_mechanized_focus_desc: "Tanks are the way forward in the military industry. We want to control the battlefield, and we will need new powerful Tanks!"
 FRA_r56rp_tank_modernisation: "Doctrinal Modernization"
 FRA_r56rp_tank_modernisation_desc: "Armored vehicles played an increasingly important role in the war. While built slightly less intimidating than your average tank, they give us an edge in communications, command, transport, and urban warfare."
 FRA_r56rp_further_armament_program: "Further Armament Program"
 FRA_r56rp_further_armament_program_desc: "With the new funds for the army, we can produce weapons en masse. We will put a rifle in the hands of everyone."
 FRA_r56rp_infantry_focus: "Levée en Masse"
 FRA_r56rp_infantry_focus_desc: "All men and women who can fight will do so. We should put government resources into the production and improvement of infantry weapons."
 FRA_r56rp_artillery_focus: "Grande Batterie"
 FRA_r56rp_artillery_focus_desc: "Our Artillery will form a single powerful unit to focus fire on specific points. We will weaken the enemy line and punch our way through one volley at a time if we have to!"
 FRA_r56rp_army_reform: "Army Reform"
 FRA_r56rp_army_reform_desc: "No infantry unit or high-tech tank alone will win us the war. We must put our efforts into developing both our tactical and strategical capabilities. With the right people on the job, we can evolve as an army."
 FRA_r56rp_general_mobilisation_order: "General Mobilization Order"
 FRA_r56rp_general_mobilisation_order_desc: "We need to keep the land army, the air force, and the marines on a war footing; and mobilize all the [FRA.GetAdjective] available."
 FRA_r56rp_africa_army: "Army of Africa"
 FRA_r56rp_africa_army_desc: "The knowledge of the Army of Africa will assure the dominance in the colonies and North Africa. We can count on the indigenous Arabs or Berber volunteers and regiments of [FRA.GetAdjective] settlers."
 FRA_r56rp_colonial_troops: "Colonial Troops"
 FRA_r56rp_colonial_troops_desc: "The Troupes Coloniales isn't part of the Army of Africa and regroups indigenous West and Central African troops overseas. We can use their equipment to fight in inhospitable lands."
 FRA_r56rp_foreign_legion: "Foreign Legion"
 FRA_r56rp_foreign_legion_desc: "The Foreign Legion is the elite branch of the Army of Africa, composed of soldiers of different nationalities and backgrounds. The legionnaires' experience and the quality of their training will be our spearhead."
 FRA_r56rp_commandos_marine: "Commandos Marine"
 FRA_r56rp_commandos_marine_desc: "The Commandos Marine are the Special Operation Forces of the [FRA.GetAdjective] Navy. Their expertise in amphibious warfare and naval reconnaissance will defend [FRA.GetNameDef] and allow her to defeat enemies, even on faraway shores."
 FRA_r56rp_blum_viollette_project: "Blum-Viollette Proposal"
 FRA_r56rp_blum_viollette_project_desc: "The Blum-Viollette proposal suggested that a minority of Algerians obtain full [FRA.GetAdjective] citizenship, with the plan to widen the benefits to other groups later. We can use this argument to recruit in the colony, but the [FRA.GetAdjective] settlers will protest massively."
 FRA_r56rp_abolish_indigenat_statut: "Abolish the Indigenat Status"
 FRA_r56rp_abolish_indigenat_statut_desc: "Every individual on [FRA.GetAdjective] soil must be equal on rights, regardless of this origin. We should give full citizenship to every Algerian, even if it means entering into conflict with the [FRA.GetAdjective] settlers."
 FRA_r56rp_the_somua_s35: "The SOMUA S35"
 FRA_r56rp_the_somua_s35_desc: "Our enemies may field a decent number of tanks. We will design and deploy a much better [FRA.GetAdjective] tank, well-armored and fast enough to frustrate any mechanized force intent on taking on the might of the [FRA.GetAdjective] Army."
 FRA_r56rp_the_mas38: "The MAS-38"
 FRA_r56rp_the_mas38_desc: "The [FRA.GetAdjective] Army has a history of using the most cutting-edge small-arms and weaponry. We shall continue on that tradition."
 FRA_r56rp_naval_construction_program: "Naval Construction Program"
 FRA_r56rp_naval_construction_program_tt: "Not enough building slots for §YNaval Base§!"
 FRA_r56rp_naval_construction_program_desc: "If we plan to expand our navy, the first step is improving and developing our naval bases. Our unique ships require constant attention to stay combat-ready at all times."
 FRA_r56rp_atlantic_domination: "Atlantic Domination"
 FRA_r56rp_atlantic_domination_desc: "Improving the design of our Battleships would lead to significant tactical advantages into the Atlantic. With their range and power uncontested, no one will be able to outrun their guns."
 FRA_r56rp_pacific_protection: "Pacific Protection"
 FRA_r56rp_pacific_protection_desc: "Naval theorists have directed our attention to our outdated carriers. They have suggestions on utilizing carriers further if development is pushed in the right direction. We cannot make real progress without our full support. It will assure control of the Pacific and help protect our colonies against [JAP.GetNameDef]."
 FRA_r56rp_darlan_doctrine: "Darlan Doctrine"
 FRA_r56rp_darlan_doctrine_desc: "Recent ship designs have opened up new tactical and strategical maneuvers at sea. Admiral Darlan has new theories on manœuvres at sea, we allocate the proper resources to have them adequately tested, and war plans solidified before the storm comes."
 FRA_r56rp_naval_gunnery: "Naval Gunnery"
 FRA_r56rp_naval_gunnery_desc: "Improve the efficiency of our naval equipment to hit harder and rule the seas."
 FRA_r56rp_mediterranean_special_measures: "Mediterranean Special Measures"
 FRA_r56rp_mediterranean_special_measures_desc: "The [ITA.GetAdjective]s are strengthening their navy and dreams to dominate the Mediterranean. If we lose our line of defense at sea, we risk a direct invasion of our homeland. We must ensure our ships are built with the latest technology to prevent this."
 FRA_r56rp_standardisation_engine: "Engine Standardization"
 FRA_r56rp_standardisation_engine_desc: "Our current submarine and naval bomber fleet is old, and changes are needed. However, there are too many variants of the main equipment pieces to build them into assembly lines. Standardization of equipment will be our priority."
 FRA_r56rp_CHEDN: "Found the CHEDN"
 FRA_r56rp_CHEDN_desc: "The College des Hautes Etudes de la Defense Nationale will be the leading theoretical institute to educate our future leaders in national defense matters. Admiral Raoul Castex has offered to build the groundwork for this grand undertaking."
 FRA_r56rp_adopt_castexian_strategy: "Adopt Castexian Strategy"
 FRA_r56rp_adopt_castexian_strategy_desc: "Admiral Castex has proposed a series of doctrinal concepts that run counter to the cult of the battleship. We should experiment with his ideas to see if they hold water."
 FRA_r56rp_adapt_young_school_concepts: "Adapt Jeune École Concepts"
 FRA_r56rp_adapt_young_school_concepts_desc: "We have seen the effectiveness in submarine raids; we should further expand upon them with newer suggestions on their usage by the Jeune École."
 FRA_r56rp_undersea_combat: "Undersea Combat"
 FRA_r56rp_undersea_combat_desc: ""
 FRA_r56rp_strategic_manoeuvre: "Strategic Manoeuvre"
 FRA_r56rp_strategic_manoeuvre_desc: "The [FRA.GetAdjective] Navy will benefit heavily from further exercises and doctrine improvement that improve upon their maneuvers at sea."
 FRA_r56rp_the_le_hardi_class_destroyer: "The Le Hardi Class Destroyer"
 FRA_r56rp_the_le_hardi_class_destroyer_desc: "The humble destroyer might be the best guardian of our ships in the sea. We shall commission a new line of destroyers capable of fulfilling that role."
 FRA_r56rp_lay_down_the_jean_bart: "Lay Down the Jean Bart"
 FRA_r56rp_lay_down_the_jean_bart_desc: "The battleship is the most effective weapon in the seas. We will see towards constructing a much more powerful master of the seas."
 FRA_r56rp_heavier_naval_guns: "Modernize Heavy Naval Guns"
 FRA_r56rp_heavier_naval_guns_desc: ""
 FRA_r56rp_gunnery_mastery_efforts: "Gunnery Mastery Efforts"
 FRA_r56rp_gunnery_mastery_efforts_desc: "By modernizing traditional battlefleet methods, sharper bracket fire, clearer shell dyes, and tighter gunnery routines we refine our fleet’s aim and engagement discipline."
 FRA_r56rp_improved_screen_ships: "Improved Screen Ships"
 FRA_r56rp_improved_screen_ships_desc: ""
 FRA_r56rp_strength_in_numbers: "Strength in Numbers"
 FRA_r56rp_strength_in_numbers_desc: "A battlefleet’s strength lies in mass and cohesion. We must expand capital and escort construction, we must ensure that we outnumber our enemies or by sheer size of our fleet, deter any aggression."
 FRA_r56rp_secure_shipping_lines: "Secure Shipping Lanes"
 FRA_r56rp_secure_shipping_lines_desc: "Submarines remain a grave threat to our merchant marine. We must develop improved anti-submarine measures and redefine convoy protection tactics. We cannot afford to let the maritime lifelines of its colonial empire fall prey to hostile raiding, securing these routes is essential for our national survival."
 FRA_r56rp_the_modern_battlefleet: "The Modern Battlefleet"
 FRA_r56rp_the_modern_battlefleet_desc: "With new fast battleships, rebuilt capital ships, and improved gunnery standards, we can truly celebrate our achievements!"
 FRA_r56rp_increase_repair_capabilities: "Increase Repair Capabilities"
 FRA_r56rp_increase_repair_capabilities_desc: "Our naval fleet will be quickly worn down, battle after battle, without the commensurate dockyard facilities to patch them up after skirmishes at sea. We will allocate the resources and expertise to do so."
 FRA_r56rp__reaffirm_ecole_de_ligne_de_bataille: "Reaffirm École de la Ligne de Bataille"
 FRA_r56rp__reaffirm_ecole_de_ligne_de_bataille_desc: "For decades, the École de la Ligne de Bataille has held that the fate of nations is decided by great battle lines of steel. Battleships, not submarines or aircraft, are the instruments of true sea power, and victory comes from meeting the enemy in open combat and breaking their fleet."
 FRA_r56rp_masters_of_the_mediterranean: "Masters of the Mediterranean"
 FRA_r56rp_masters_of_the_mediterranean_desc: "With Italy looming across the narrow sea like a dark wall of marble and fire, we make ready on our shores for the final struggle that will decide, once and for all, who truly commands the Mare Nostrum."
 FRA_r56rp_the_alsace_program: "The Alsace Program"
 FRA_r56rp_the_alsace_program_desc: "The proposed Alsace-class battleships, larger and more heavily armed than anything currently afloat, were once deemed too ambitious. With renewed commitment to the battle line, we can resume work on these titans and secure our mastery of the Mediterranean"
 FRA_r56rp_endorse_the_jeune_ecole: "Endorse the Jeune École"
 FRA_r56rp_endorse_the_jeune_ecole_desc: ""
 FRA_r56rp_torpedo_boat_development: "Torpedo Boat Development"
 FRA_r56rp_torpedo_boat_development_desc: "Small, fast attack craft represent the purest expression of Jeune École thinking. By refining torpedo technology and expanding dedicated construction facilities, we can produce vessels able to strike ships many times their size."
 FRA_r56rp_submarine_efforts: "Submarine Efforts"
 FRA_r56rp_submarine_efforts_desc: "We have witnessed the utter devastation the U-Boat Campaigns of the Great War single-handedly, submarine warfare has come to maturity in the last decade, it now poses a real threat to any and all surface ships - if we are to survive the next war, our naval forces must be a threat."
 FRA_r56rp_sea_denial_doctrine: "Sea Denial Doctrine"
 FRA_r56rp_sea_denial_doctrine_desc: "Officers of our esteemed navy claim that France cannot hope to dominate the oceans, but it can deny them to it's enemies. A doctrine that emphasizes mines, torpedoes, ambushes, and asymmetric actions to make hostile shipping permanently endangered must be swiftly adopted."
 FRA_r56rp_intensify_torpedo_manufacturing: "Intensify Torpedo Manufacturing"
 FRA_r56rp_intensify_torpedo_manufacturing_desc: "With our plans set in motion, if we are to support a large fleet of submarines, torpedo boats and commerce raiders we must intensify the production of torpedos by standarization of components and expansion of arms factories."
 FRA_r56rp_expand_naval_intelligence: "Expand Naval Intelligence"
 FRA_r56rp_expand_naval_intelligence_desc: "Following Jeune École principles, expanding cryptography, surveillance networks and oceanographic intelligence will allow us to manoeuvre swiftly against our foes."
 FRA_r56rp_colonial_naval_bases: "Colonial Naval Bases"
 FRA_r56rp_colonial_naval_bases_desc: ""
 FRA_r56rp_colonial_repair_facilities: "Colonial Repair Facilities"
 FRA_r56rp_colonial_repair_facilities_desc: "Expanding repair docks across our colonial empire ensures lengthened global naval endurance,damaged ships will be able to return to action quickly and allow our forces to operate far from home with confidence."
 FRA_r56rp_ecole_navale_asymetrique: "École Navale Asymétrique"
 FRA_r56rp_ecole_navale_asymetrique_desc: ""
 FRA_r56rp_ecole_navale_combine: "École Navale Combinée"
 FRA_r56rp_ecole_navale_combine_desc: "By studying both the Jeune École and Castex’s theories, we begin forging a unified naval doctrine. Integrating their insights into a single strategic vision, while keeping the old guard at bay."
 FRA_r56rp_cruiser_raiders: "Cruiser Raiders"
 FRA_r56rp_cruiser_raiders_desc: "Cruiser squadrons built for speed, autonomy, and strategic maneuver will let us threaten the enemy’s maritime supply lanes forcing our enemies to guard every ocean."
 FRA_r56rp_armee_de_la_air: "Armée de l’air"
 FRA_r56rp_armee_de_la_air_desc: "The time has come to expand on our Airforce! By expanding our air bases, reorganizing command structures, and preparing for mass production of modern aircraft, we can lay the foundation for a powerful and capable French air force."
 FRA_r56rp_fund_aeronautical_research_facilities: "Fund Aeronautical Research Facilities"
 FRA_r56rp_fund_aeronautical_research_facilities_desc: "Our aviation industry suffers from fragmentation and outdated facilities, by funding the Service Technique de l'Aéronautique we may yet close the gap between our aircraft and foreign powers."
 FRA_r56rp_ecole_de_lair: "École de l’Air"
 FRA_r56rp_ecole_de_lair_desc: "To ensure a new generation of skilled pilots and officers, the École de l’Air must be expanded and modernized. By improving training standards and refining our doctrine, we can prepare a professional air arm ready to meet the challenges ahead."
 FRA_r56rp_nationalize_key_aircraft_industries: "Nationalize Key Aircraft Industries"
 FRA_r56rp_nationalize_key_aircraft_industries_desc: "Forming united production groups from the fragmented aircraft industry will allow us to standarize production and greater production effiency."
 FRA_r56rp_light_aircraft_modernisation_program: "Light Aircraft Modernization Program"
 FRA_r56rp_light_aircraft_modernisation_program_desc: ""
 FRA_r56rp_heavy_aircraft_modernisation_program: "Heavy Aircraft Modernization Program"
 FRA_r56rp_heavy_aircraft_modernisation_program_desc: ""
 FRA_r56rp_modernisation_program: "Modernization Program"
 FRA_r56rp_modernisation_program_desc: "We can apply some revolutionary civilian engineering to our Fighters to improve their speed, range, and max altitude. We need to focus on this if we want to keep up with the advancements made by others."
 FRA_r56rp_resolve_engine_deficiency: "Resolve Engine Deficiency"
 FRA_r56rp_resolve_engine_deficiency_desc: "Our airforce has always been plagued by the lack of powerful engines available for the production line, with our recent standarization and nationalization of aircraft producers - we are able to develop and produce engines at sustainable rates." 
 FRA_r56rp_buy_americain: "Buy [USA.GetAdjective] Bombers"
 FRA_r56rp_buy_americain_desc: "Air support is an integral part of both our defensive and offensive capabilities. However, our current bomber models are too old, but we will stay in the race if we can buy the latest [USA.GetAdjective] models."
 FRA_r56rp_buy_americain_tooltip: "We will receive 200 tactical bombers from the [USA.GetNameDef]."
 FRA_r56rp_barrage_david: "Barrage David"
 FRA_r56rp_barrage_david_desc: "Inspired by the [ENG.GetAdjective] discovery, a new model of bistatic radar has been developed by the air army to detect enemy planes."
 FRA_r56rp_jet_effort: "Jet Effort"
 FRA_r56rp_jet_effort_desc: "Air combat is all about mobility. The jet engine is such a decisive advancement that the enemy pilots will seem to stand still while we rip them out of the sky."
 FRA_r56rp_interwar_experience: "Interwar Experience"
 FRA_r56rp_interwar_experience_desc: "Planes that support our land forces have been a very efficient addition during the interwar Anti-Atlas revolt. These planes now have several suggested improvements, and we should add them to our maneuvers."
 FRA_r56rp_reorganize_air_army: "Reorganize the Air Army"
 FRA_r56rp_reorganize_air_army_desc: "We have gained enough experience to test new theories in air warfare faster, but with our current command structure, the air army is difficult to manage. We need first to do some reorganization."
 FRA_r56rp_parachute_battalions: "G.I.A 601-602"
 FRA_r56rp_parachute_battalions_desc: "The [SOV.GetAdjective]s have created a new airborne detachment to drop soldiers and equipment, and we should make a similar military group."
 FRA_r56rp_purchase_american_fighters: "Purchase [USA.GetAdjective] Fighters"
 FRA_r56rp_purchase_american_fighters_desc: "Our current lack of modern light aircraft is a strategic weakness. We should contact the [USA.GetAdjective]s and purchase some high-performance aircraft to secure our air dominance."
 FRA_r56rp_form_the_first_strategic_bombing_unit: "Form the First Strategic Bombing Unit"
 FRA_r56rp_form_the_first_strategic_bombing_unit_desc: "Bombing the enemy nation's factories and war-making potential offers a significant deterrence, disincentivizing further hostilities. We should form a bomber wing capable of exploiting this strategic capability."
 FRA_r56rp_support_the_ecole_de_lair: "Support the École de l'Air"
 FRA_r56rp_support_the_ecole_de_lair_desc: "Our own École de l'Air trains pilots into aerial dog fighting and bombing experts. We should look into improving the air training programs to suit the needs of our rapidly-expanding air force."
 FRA_r56rp_faire_face: "Faire Face"
 FRA_r56rp_faire_face_desc: "With our improved Air Force, we may begin to test current developments and overcome old ideas with new theories on executing air operations and using planes in formations."
 FRA_r56rp_finalize_the_potez_630: "Finalize the Potez 630"
 FRA_r56rp_finalize_the_potez_630_desc: "WIP"
 FRA_r56rp_finalize_the_potez_630_tt: "Enables production of the §HPotez 630§! if not already researched.\nThe §HPotez 630§! is §Gcheaper§! to produce than regular Fighters.\n"
 FRA_r56rp_develop_the_ms_406: "Develop the M.S. 406"
 FRA_r56rp_develop_the_ms_406_desc: "WIP"
 FRA_r56rp_enact_plan_v: "Enact Plan V"
 FRA_r56rp_enact_plan_v_desc: "Recent advances in air doctrines and organization allow us to structure a significant force capable of carrying out whatever air operations we desire. We should now allocate the funds and production capabilities to build up our war machines in the air to take advantage of these new theories."
 FRA_r56rp_develop_bomber_fleet: "Develop Bomber Fleet"
 FRA_r56rp_develop_bomber_fleet_desc: "Now that we have can field a significant air force, we should look into developing even better bombers to carry more bombs and fly farther and faster. Let the enemy know that the Tricolore can deliver high-explosives anytime, anywhere."
 FRA_r56rp_follow_up_on_the_potez: "Follow Up on the Potez"
 FRA_r56rp_follow_up_on_the_potez_desc: "The long-range bomber is defenseless without her trusty escort. We should see the development of larger, higher-ranged fighter escorts for our bombers."
 FRA_r56rp_provide_aerial_support: "Provide Aerial Support"
 FRA_r56rp_provide_aerial_support_desc: "Newer planes, capable of carrying a bigger bomb load and more durable airframes, will be well suited to our doctrine where planes support the infantry assaults and advances."
 FRA_r56rp_new_french_fighter: "New [FRA.GetAdjective] Fighter"
 FRA_r56rp_new_french_fighter_desc: "The next generation of [FRA.GetAdjective] light fighters will outgun, outfight and outmaneuver the opposition."
 FRA_r56rp_supprt_the_aeronavale: "Support the Aéronavale"
 FRA_r56rp_supprt_the_aeronavale_desc: "Our naval air branch will now be equipped with newer designs capable of laying waste to entire fleets."
