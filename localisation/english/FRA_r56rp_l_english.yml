 FRA_r56rp_fund_east_africa_desc: ""
 FRA_r56rp_expand_the_oriental_company: "Expand the Oriental Development Company"
 FRA_r56rp_expand_the_oriental_company_desc: ""
 FRA_r56rp_end_of_the_colonial_empire: "End of the Colonial Empire"
 FRA_r56rp_end_of_the_colonial_empire_desc: ""
 FRA_r56rp_professionalize_colonial_forces: "Professionalize the Colonial Forces"
 FRA_r56rp_professionalize_colonial_forces_desc: "By improving training, equipment, and command structures, we will transform our colonial forces into a disciplined and reliable elite capable of defending French interests overseas."
 FRA_r56rp_equality_under_the_flag: "Equality under the Flag"
 FRA_r56rp_equality_under_the_flag_desc: "All who serve France shall stand equal beneath the tricolor, strengthening unity, loyalty, and cohesion across the Empire."
 FRA_r56rp_colonial_army_of_france: "Troupes Coloniale"
 FRA_r56rp_managed_employment: "Managed Employment"
 FRA_r56rp_maintain_parliamentary_oversight: "Maintain Parliamentary Oversight"
 FRA_r56rp_maintain_parliamentary_oversight_desc: ""
 FRA_r56rp_adress_the_stagnant_economy: "Adress the Stagnant Economy"
