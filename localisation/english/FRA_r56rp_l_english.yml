l_english:
 # R56RP Dynamic Modifier
 FRA_r56rp_marine_national:0 "La Marina National"
 FRA_r56rp_marine_national_desc:0 "Through innovation and unified doctrine, we reclaim command of the seas. Our cruisers will strike the distant lanes, our submarines the depths, and the Marine Nationale shall guard France’s destiny\n\nToujours en Avant."
 FRA_r56rp_marine_national_dynamic_modifier_tt:0 "Modify §Y$FRA_r56rp_marine_national$§! by"
 FRA_r56rp_armee_de_lair:0 "Armée de l'Air"
 FRA_r56rp_armee_de_lair_desc:0 "Still developing its identity as an independent force, the Armée de l’Air faces the growing reality that much of its equipment is falling behind. To safeguard France, we must modernize quickly and restore our edge in the skies.\n\n"
 FRA_r56rp_armee_de_lair_tt:0 "Modify §Y$FRA_r56rp_armee_de_lair$§! by"
 FRA_r56rp_armee_de_terra:0 "Armée de Terre"
 FRA_r56rp_armee_de_terra_desc:0 ""
 FRA_r56rp_armee_de_terra_tt:0 "Modify §Y$FRA_r56rp_armee_de_terra$§! by"


 # R56RP Decisions
 FRA_national_defence_plan_cat:0 "National Defence Plan"
 FRA_national_defence_plan_cat_desc:0 "Victory in the Great War has lulled much of our military into a dangerous sense of security. Yet the world grows darker by the day, and France must not face the next conflict unprepared."
 FRA_expand_aircraft_procurement:0 "Expand Aircraft Procurement"
 FRA_expand_aircraft_procurement_desc:0 "The CSG has concluded that our stock of modern aircraft is far too small to meet the demands of the next war. By accelerating the procurement programs outlined in Plans I–III, we can finally begin rebuilding a capable and modern air fleet."
 FRA_execute_the_dyle_plan:0 "Execute the Dyle Plan"
 FRA_execute_the_dyle_plan_desc:0 "To shield northern France and protect Belgium, the CSG has approved the Dyle Plan. Our forces will advance to the Dyle River line at the outbreak of war, establishing a forward defense to contain any German offensive."
 FRA_expand_the_armed_forces: "Expand the Armée de Terre"
 FRA_the_dyle_mission: "The Dyle Mission"

 # Custom Triggers - R56RP
 FRA_strenghten_aircraft_small_procurement_tt:0 "Has produced or acquired §Y[?ROOT.FRA_fighters_to_produce]§! new §Y$fighter_equipment$§! aircraft. \nCurrent Fighters §YDeployed§! or in §YStockpile§!: §G[?ROOT.num_deployed_planes_with_type@small_plane_airframe]§!\n"

 FRA_strenghten_aircraft_large_procurement_tt:0 "Has produced or acquired §Y[?ROOT.FRA_bombers_to_produce]§! new §Y$tac_bomber_equipment$§! aircraft. \nCurrent Bombers §YDeployed§! or in §YStockpile§!: §G[?ROOT.num_deployed_planes_with_type@medium_plane_airframe]§!\n"

 FRA_strenghten_cas_procurement_tt:0 "Has produced or acquired §Y[?ROOT.FRA_CAS_to_produce]§! new §Y$CAS_equipment$§! aircraft. \nCurrent Close Air Support §YDeployed§! or in §YStockpile§!: §G[?ROOT.num_deployed_planes_with_type@small_plane_cas_airframe]§!"

 # Ideas
 r56rp_bilateral_trade_agreement:0 "Bilateral Trade Agreements"
 r56rp_FRA_fortify_marianne:0 "Fortify Our Marianne"
 # Focuses
 FRA_armee_de_terre: "Armée de Terre"
 FRA_armee_de_terre_desc: ""
 FRA_kickstart_the_arms_industry:0 "Kickstart the Arms Industry"
 FRA_kickstart_the_arms_industry_desc:0 "The early rearmament programs Plans I through III,revealed how far our armaments sector has fallen behind. By injecting funds, reorganizing industry, and accelerating state oversight, we can finally kickstart large-scale weapons production and meet the demands of modern war."
 FRA_la_bataille_methodique:0 "La Battaile Methodique"
 FRA_la_bataille_methodique_desc:0 "We remain committed to the doctrine where firepower, fixed schedules, and centralized control dictate the tempo of battle though slow and inflexible, this method offers predictability if not adaptability in the conflicts to come."
 FRA_supressive_barrage:0 "Suppresive Barrage"
 FRA_supressive_barrage_desc:0 "With our modernization and planning complete our army can now employ sustained suppressive fire to pin down enemy formations, disrupt their movements, and create openings for decisive assaults."
 FRA_chasseurs_de_chars:0 "Chasseurs de Chars"
 FRA_chasseurs_de_chars_desc:0 "To counter the armored threat posed by our rivals, specialized tank-destroyer formations must be developed. Fast, well-armed, and designed to eliminate enemy armor, these vehicles will provide an agile and lethal anti-tank spearhead."
 FRA_doctrinal_modernization:0 "Doctrinal Modernization"
 FRA_doctrinal_modernization_desc:0 "With the structure of our armored forces now established and our plans set in motion, we can finally face our enemies with confidence. Not only relying on the strength of the Maginot and the men manning it to protect us."
 FRA_legere_mecanique:0 "Legere Mecanique"
 FRA_legere_mecanique_desc:0 "We have been relying on cavalry far too long, our armoured forces must be supported by armoured vehicles. Many of our national companies have already come foward with designs for said vehicles."
 FRA_chasseur_alpine:0 "Chasseur Alpine"
 FRA_chasseur_alpine_desc:0 "Alpine warfare demands troops capable of swift movement, precision, and unmatched stamina. By expanding our formations, our elite units will be able to exploit the natural defenses of our highlands and seize the tactical advantage in rugged terrain."
 FRA_frontline_hospitals:0 "Frontline Hospitals"
 FRA_frontline_hospitals_desc:0 "The Great War taught us a painful lesson, countless brave soldiers were lost not only to enemy fire, but to infection, exposure, and disease. By investing in modern frontline medical units, we can ensure that the next war, if it comes will not claim so many lives needlessly"
 FRA_end_the_interservice_rivalry:0 "End the Interservice Rivalry"
 FRA_end_the_interservice_rivalry_desc:0 ""
 FRA_strengthen_northern:0 "Strengthen Northern Industry"
 FRA_strengthen_northern_desc:0 ""
 FRA_strengthen_southern:0 "Strengthen Southern Industry"
 FRA_strengthen_southern_desc:0 ""
 FRA_empower_the_national_economic_council:0 "Empower the National Economic Council"
 FRA_empower_the_national_economic_council_desc:0 "Although the National Economic Council was established back in 1925, it has long been underused and politically sidelined. By revitalizing the Council and expanding its authority, we can restore it as a central forum where unions, employers, and government experts coordinate our response to the economic crisis."
 FRA_nationalize_gas_and_electricity_sector:0 "Nationalize Gas and Electricity Sector"
 FRA_nationalize_gas_and_electricity_sector_desc:0 ""
 FRA_ride_it_out:0 "Ride It Out"
 FRA_ride_it_out_desc:0 "Devaluation may promise quick relief, but it also brings chaos, inflation, and the ruin of millions who trust the stability of the franc. Our nation will hold firm!"
 FRA_renault_factories:0 "Renault Factories"
 FRA_renault_factories_desc:0 "With the looming of a conflict, Renault has proposed investing in the southern french states by moving their production lines further away from the battlefields."
 FRA_expand_the_calais_mining_basin:0 "Expand the Calais Basin"
 FRA_expand_the_calais_mining_basin_desc:0 "The Calais basin remains the industrial heart of France, producing the majority of our coal. By modernizing its mines, expanding extraction shafts, and improving railway access, we can significantly increase national energy output and reduce dependence on imported fuels."
 FRA_bilateral_trade_agreements:0 "Bilateral Trade Agreements"
 FRA_bilateral_trade_agreements_desc:0 "With global trade still weakened by the Depression, We must secure reliable markets through negotiated agreements. Strengthening our commercial ties with friendly nations will stabilize exports, ensure access to materials, and reinforce our position in Europe."