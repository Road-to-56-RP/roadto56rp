 # Focuses
 FRA_r56rp_armee_de_terre: "Armée de Terre"
 FRA_r56rp_armee_de_terre_desc: ""
 FRA_r56rp_kickstart_the_arms_industry: "Kickstart the Arms Industry"
 FRA_r56rp_kickstart_the_arms_industry_desc: "The early rearmament programs Plans I through III,revealed how far our armaments sector has fallen behind. By injecting funds, reorganizing industry, and accelerating state oversight, we can finally kickstart large-scale weapons production and meet the demands of modern war."
 FRA_r56rp_la_bataille_methodique: "La Battaile Methodique"
 FRA_r56rp_la_bataille_methodique_desc: "We remain committed to the doctrine where firepower, fixed schedules, and centralized control dictate the tempo of battle though slow and inflexible, this method offers predictability if not adaptability in the conflicts to come."
 FRA_r56rp_supressive_barrage: "Suppresive Barrage"
 FRA_r56rp_supressive_barrage_desc: "With our modernization and planning complete our army can now employ sustained suppressive fire to pin down enemy formations, disrupt their movements, and create openings for decisive assaults."
 FRA_r56rp_chasseurs_de_chars: "Chasseurs de Chars"
 FRA_r56rp_chasseurs_de_chars_desc: "To counter the armored threat posed by our rivals, specialized tank-destroyer formations must be developed. Fast, well-armed, and designed to eliminate enemy armor, these vehicles will provide an agile and lethal anti-tank spearhead."
 FRA_r56rp_doctrinal_modernization: "Doctrinal Modernization"
 FRA_r56rp_doctrinal_modernization_desc: "With the structure of our armored forces now established and our plans set in motion, we can finally face our enemies with confidence. Not only relying on the strength of the Maginot and the men manning it to protect us."
 FRA_r56rp_legere_mecanique: "Legere Mecanique"
 FRA_r56rp_legere_mecanique_desc: "We have been relying on cavalry far too long, our armoured forces must be supported by armoured vehicles. Many of our national companies have already come foward with designs for said vehicles."
 FRA_r56rp_chasseur_alpine: "Chasseur Alpine"
 FRA_r56rp_chasseur_alpine_desc: "Alpine warfare demands troops capable of swift movement, precision, and unmatched stamina. By expanding our formations, our elite units will be able to exploit the natural defenses of our highlands and seize the tactical advantage in rugged terrain."
 FRA_r56rp_frontline_hospitals: "Frontline Hospitals"
 FRA_r56rp_frontline_hospitals_desc: "The Great War taught us a painful lesson, countless brave soldiers were lost not only to enemy fire, but to infection, exposure, and disease. By investing in modern frontline medical units, we can ensure that the next war, if it comes will not claim so many lives needlessly"
 FRA_r56rp_end_the_interservice_rivalry: "End the Interservice Rivalry"
 FRA_r56rp_end_the_interservice_rivalry_desc: ""
 FRA_r56rp_strengthen_northern: "Strengthen Northern Industry"
 FRA_r56rp_strengthen_northern_desc: ""
 FRA_r56rp_strengthen_southern: "Strengthen Southern Industry"
 FRA_r56rp_strengthen_southern_desc: ""
 FRA_r56rp_empower_the_national_economic_council: "Empower the National Economic Council"
 FRA_r56rp_empower_the_national_economic_council_desc: "Although the National Economic Council was established back in 1925, it has long been underused and politically sidelined. By revitalizing the Council and expanding its authority, we can restore it as a central forum where unions, employers, and government experts coordinate our response to the economic crisis."
 FRA_r56rp_nationalize_gas_and_electricity_sector: "Nationalize Gas and Electricity Sector"
 FRA_r56rp_nationalize_gas_and_electricity_sector_desc: ""
 FRA_r56rp_ride_it_out: "Ride It Out"
 FRA_r56rp_ride_it_out_desc: "Devaluation may promise quick relief, but it also brings chaos, inflation, and the ruin of millions who trust the stability of the franc. Our nation will hold firm!"
 FRA_r56rp_renault_factories: "Renault Factories"
 FRA_r56rp_renault_factories_desc: "With the looming of a conflict, Renault has proposed investing in the southern french states by moving their production lines further away from the battlefields."
 FRA_r56rp_expand_the_calais_mining_basin: "Expand the Calais Basin"
 FRA_r56rp_expand_the_calais_mining_basin_desc: "The Calais basin remains the industrial heart of France, producing the majority of our coal. By modernizing its mines, expanding extraction shafts, and improving railway access, we can significantly increase national energy output and reduce dependence on imported fuels."
 FRA_r56rp_bilateral_trade_agreements: "Bilateral Trade Agreements"
 FRA_r56rp_bilateral_trade_agreements_desc: "With global trade still weakened by the Depression, We must secure reliable markets through negotiated agreements. Strengthening our commercial ties with friendly nations will stabilize exports, ensure access to materials, and reinforce our position in Europe."
 FRA_r56rp_modernization_of_the_battlefleet: "Modernization of the Battlefleet"
 FRA_r56rp_modernization_of_the_battlefleet_desc: "Although we have fully embraced the Jeune École, our navy still relies heavily on large, aging capital ships. At this pace, our fleet will become obsolete within a few years. We must modernize our battlefleet to reflect our new doctrine, prioritizing speed, flexibility, and modern technology over sheer size."
 FRA_r56rp_marine_nationale: "Marine Nationale"
 FRA_r56rp_marine_nationale_desc: ""
 FRA_r56rp_reaffirm_ecole_de_ligne_de_bataille: "Reaffirm École de la Ligne de Bataille"
 FRA_r56rp_reaffirm_ecole_de_ligne_de_bataille_desc: ""
 FRA_r56rp_ministere_de_la_france_de_outre_mer: "Ministère de la France d’Outre-Mer"
 FRA_r56rp_ministere_de_la_france_de_outre_mer_desc: ""
 FRA_r56rp_withdraw_from_our_contested_holdings: "Withdraw from Contested Holdings"
 FRA_r56rp_withdraw_from_our_contested_holdings_desc: ""
 FRA_r56rp_revisit_colonial_policy: "Revisit Colonial Policy"
 FRA_r56rp_revisit_colonial_policy_desc: "Rising unrest and changing international conditions demand a reassessment of our overseas governance. Maintaining the status quo is no longer a viable option."
 FRA_r56rp_reinforce_the_empire: "Reinforce the Empire"
 FRA_r56rp_reinforce_the_empire_desc: "In order for our country to withstand pressure of the growing world, we need to reinforce our colonial holdings, the vast resources will continue to streghten our stance in the world."
 FRA_r56rp_freedom_for_the_pacific: "Freedom for the Pacific"
 FRA_r56rp_freedom_for_the_pacific_desc: "The Pacific territories are costly to govern and difficult to defend. Increased autonomy offers a practical solution to local demands while maintaining French access and cooperation"
 FRA_r56rp_self_goverment_for_the_americas: "Self-Goverment for the Americas"
 FRA_r56rp_self_goverment_for_the_americas_desc: "Granting self-rule to the Caribbean and Guianan territories will reduce resistance and allow us to step back without completely abandoning its strategic and economic interests."
 FRA_r56rp_suppress_independence_movements: "Suppress Independence Movements"
 FRA_r56rp_suppress_independence_movements_desc: ""
 FRA_r56rp_societe_financiere_francaise_et_coloniale: "Société Financière Française et Coloniale"
 FRA_r56rp_societe_financiere_francaise_et_coloniale_desc: ""
 FRA_r56rp_maintain_the_union: "Maintain the Union"
 FRA_r56rp_maintain_the_union_desc: "The Indochinese Union is the jewel of our overseas empire. Its unity under French authority is essential to stability, prosperity, and the preservation of our influence in the Far East. We cannot allow this structure to be dismantled."
 FRA_r56rp_reinforce_indigenous_authorities: "Reinforce Indigenous Authorities"
 FRA_r56rp_reinforce_indigenous_authorities_desc: "Across our overseas possessions, a loyal colonial elite has emerged,  administrators, officers, and notables whose interests are inseparable from those of France."
 FRA_r56rp_allies_not_subjects: "Allies not Subjects"
 FRA_r56rp_allies_not_subjects_desc: "The colonial system can no longer be maintained as it is. By transforming our overseas territories into partners rather than dependents, France may retain influence while avoiding open unrest."
 FRA_r56rp_citizenship_through_service: "Citizenship Through Service"
 FRA_r56rp_citizenship_through_service_desc: "The French Republic has always rewarded loyalty. Those among our colonial subjects who serve France whether in uniform, administration, or industry will be granted full citizenship and protected by all laws of men."
 FRA_r56rp_reorganize_the_gendarmerie: "Reorganize the Gendarmerie"
 FRA_r56rp_reorganize_the_gendarmerie_desc: ""
 FRA_r56rp_establishment_of_the_free_french_union: "Establish the Nouveau Union Française"
 FRA_r56rp_establishment_of_the_free_french_union_desc: ""
 FRA_r56rp_planned_economy: "Planned Economy"
 FRA_r56rp_planned_economy_desc: ""
 FRA_r56rp_invest_into_our_african_colonies: "Invest into our African Colonies"
