 # Events
 r56rp_news.1.t: "The Pakse Incident"
 r56rp_news.1.d: "Following a raid into the [FRI.GetAdjective] border village of Pakse, which saw multiple civilian deaths, the [FRI.GetAdjective] is now demanding that the [SIA.GetAdjective] submit rulership of the two borderstates of Isan and Lanna to the [FRI.GetAdjective]. However, the [SIA.GetAdjective] is remaining firm that they were only driving out troops coming from [FRI.GetAdjective] and that they will not giving up their land to a colonial power.\n\nTensions are now rising along the border between both nations and it's looking very likely that War is going to breakout between them"
 r56rp_news.1.a: "It seems the borders may be redrawn soon"
 r56rp_news.1.b: "Very well, we'll seize it all"
 r56rp_news.1.c: "We shall push the French of this Peninsula"
 

 FRI_r56rp.1.t: "[FROM.GetAdjective] Troops encroaching on our land"
 FRI_r56rp.1.d: "Ever since the reorganization of [FROM.GetNameDef] they have become increasingly more hostile towards us, showing their true colonial roots. Now, a detachement of their troops have been reported crossing the border in Isan, we have already dispatched a unit to repell them"
 FRI_r56rp.1.a: "The Goddamned French!"
 FRI_r56rp.2.t: "Success in Isan"
 FRI_r56rp.2.d: "Before the engagement our troops in Isan managed to get into a tactically superior position, allowing our troops to ambush the enemy. The Officer in charge has written a quite detailed After Action Report that should be studied and see what we can learn from it"
 FRI_r56rp.2.a: "As expected!"
 FRI_r56rp.3.t: "Defeat in Isan"
 FRI_r56rp.3.d: "It turns out that the hostile troops had managed to get into superior positions prior to our engagement and our troops were beaten back. We will have to study the After Action Report and see what we can improve before a real engagement"
 FRI_r56rp.3.a: "Interesting..."
 FRI_r56rp.4.t: "The Pakse Incident"
 FRI_r56rp.4.d: "Following yet another [FROM.GetAdjective] attempted incursion into Isan, our units chased their units into Champasak where another skirmish broke out, ending up with a fire breaking out inside the border village of Pakse. Now, the [FROM.GetAdjective] is demanding reparations in the form of border redrawing to 'protect' Laotian citizens from potential further incursions.\n\nThe [FROM.GetAdjective] have demanded that we withdraw our forces from the states of Lanna and Isan and transfer control over them to the government in Hanoi, with the [FROM.GetAdjective] saying that refusal to do so will be seen as an act of war."
 FRI_r56rp.4.a: "And submit to colonial oppression?! Never!"
 FRI_r56rp.4.b: "We can't afford a war right now..."
